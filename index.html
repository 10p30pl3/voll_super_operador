  /* ==================================================================== */
  /* interações                                                           */
  /* ==================================================================== */

  function autoGrow(input) {
    input.style.height = 'auto';
    input.style.height = Math.min(88, input.scrollHeight) + 'px';
  }

  function focusCard(id) {
    var el = cards[id];
    if (!el) return;
    el.classList.add('card--focus');
    setTimeout(function () { el.classList.remove('card--focus'); }, 900);
    var input = el.querySelector('[data-role="input"]');
    if (input) input.focus({ preventScroll: true });
  }

  function startRecording(id) {
    var conv = sel.byId(id);
    if (!conv || conv.ui.recording) return;
    conv.ui.recording = { seconds: 0 };
    conv.ui.emojiOpen = false;
    A.changed();
    recTimers[id] = setInterval(function () {
      var c = sel.byId(id);
      if (!c || !c.ui.recording) return stopTimer(id);
      c.ui.recording.seconds += 1;
      var el = cards[id];
      if (el) el.querySelector('.rec__t').textContent = U.fmtClock(c.ui.recording.seconds);
      if (c.ui.recording.seconds >= 300) sendRecording(id);
    }, 1000);
  }

  function stopTimer(id) {
    if (recTimers[id]) {
      clearInterval(recTimers[id]);
      delete recTimers[id];
    }
  }

  function cancelRecording(id) {
    var conv = sel.byId(id);
    stopTimer(id);
    if (conv) conv.ui.recording = null;
    A.changed();
  }

  function sendRecording(id) {
    var conv = sel.byId(id);
    if (!conv || !conv.ui.recording) return;
    var secs = Math.max(1, conv.ui.recording.seconds);
    stopTimer(id);
    A.sendAudio(id, secs);
  }

  function submitFromInput(id) {
    var conv = sel.byId(id);
    if (!conv) return;
    var el = cards[id];
    var input = el ? el.querySelector('[data-role="input"]') : null;
    var text = input ? input.value : conv.ui.draft;
    if (!text.trim() && !conv.ui.attachment) return;
    conv.ui.emojiOpen = false;
    A.sendMessage(id, text);
    if (input) { input.value = ''; autoGrow(input); }
  }

  function closeMenus(except) {
    var changed = false;
    S.conversations.forEach(function (c) {
      if (c.ui.menuOpen && c.id !== except) { c.ui.menuOpen = false; changed = true; }
    });
    return changed;
  }

  function handleAction(act, id, node) {
    /* qualquer ação fecha o menu de contexto */
    if (act !== 'menu') closeMenus();

    switch (act) {
      case 'menu': {
        var c0 = sel.byId(id);
        if (!c0) break;
        var willOpen = !c0.ui.menuOpen;
        closeMenus(id);
        c0.ui.menuOpen = willOpen;
        c0.ui.emojiOpen = false;
        A.changed();
        break;
      }

      case 'close':      A.closeConversation(id); break;
      case 'pause':      A.pauseAI(id); break;
      case 'start':      A.startAI(id); break;
      case 'takeover':   A.takeOverConversation(id); focusCard(id); break;
      case 'return':     A.returnToAI(id); break;
      case 'resolve':    A.resolveAlert(id); break;
      case 'tabular':    openTabulationModal(id); break;
      case 'transferir': openTransferModal(id); break;
      case 'details':    openDetailsModal(id); break;
      case 'send':       submitFromInput(id); break;
      case 'unattach':   A.clearAttachment(id); break;
      case 'mic':        startRecording(id); break;
      case 'rec-cancel': cancelRecording(id); break;
      case 'rec-send':   sendRecording(id); break;
      case 'clear-notifs': A.markAllNotificationsRead(); break;
      case 'smart-now':         A.flushSmart(id); break;
      case 'smart-cancel':      A.cancelSmart(id); break;
      case 'smart-edit':        A.editSmart(id, true); break;
      case 'smart-cancel-edit': A.editSmart(id, false); break;
      case 'smart-config':      S.smartOpen = !S.smartOpen; A.changed(); break;

      case 'smart-save': {
        var cardS = cards[id];
        var ta = cardS && cardS.querySelector('[data-role="smart-text"]');
        A.saveSmart(id, ta ? ta.value : '');
        break;
      }
      case 'summary':     openSummaryModal(id); break;
      case 'kb-list':     openKnowledgeList(); break;
      case 'kb-open':     openKnowledgeModal(id); break;

      case 'sum-copy': {
        var convS = sel.byId(id);
        if (!convS) break;
        var text = SO.summary.asText(SO.summary.build(convS));
        if (navigator.clipboard) navigator.clipboard.writeText(text);
        node.innerHTML = ic('check', 'icon--sm') + 'Resumo copiado';
        break;
      }

      case 'kb-pick': {
        var convK = sel.byId(id);
        if (!convK) break;
        var list = kbSelection(convK);
        var msgK = node.getAttribute('data-msg');
        var at = list.indexOf(msgK);
        if (at === -1) list.push(msgK); else list.splice(at, 1);
        refreshKbUi(id);
        break;
      }

      case 'kb-clear': {
        var convC = sel.byId(id);
        if (convC) convC.ui.kbSelection = [];
        refreshKbUi(id);
        break;
      }

      case 'kb-confirm': {
        var m4 = dom.modalRoot.querySelector('.modal');
        var q = m4.querySelector('[data-role="kb-q"]').value.trim();
        var a = m4.querySelector('[data-role="kb-a"]').value.trim();
        var topic = m4.querySelector('[data-role="kb-topic"]').value;
        var hint4 = m4.querySelector('[data-role="hint"]');
        if (!q || !a) {
          hint4.className = 'hint hint--err';
          hint4.textContent = 'Preencha a pergunta do cliente e a resposta que a IA deve dar.';
          break;
        }
        closeModal();
        A.sendToKnowledge(id, kbSelection(sel.byId(id)).slice(), { question: q, answer: a, topic: topic });
        refreshKbUi(id);
        break;
      }
      case 'contact-find': openContactModal(); break;
      case 'ct-search':    contactResults(); break;
      case 'ct-pick':      openChannelModal(node.getAttribute('data-ct')); break;
      case 'hsm-open':     openHsmModal(id); break;

      case 'ct-hist': {
        var ct = contactById(node.getAttribute('data-ct'));
        if (!ct) break;
        var digits = U.digits(ct.phone);
        var hit = null;
        S.conversations.forEach(function (c) {
          if (U.digits(c.phone) === digits) hit = c;
        });
        if (hit) {
          closeModal();
          A.openConversation(hit.id);
          ctHint('Histórico encontrado: ' + ct.name + ' já tem atendimento em andamento.');
        } else {
          ctHint(ct.name + ' não tem atendimento anterior nos últimos 90 dias.');
        }
        break;
      }

      case 'ct-channel': {
        var contact = contactById(node.getAttribute('data-ct'));
        if (!contact) break;
        closeModal();
        var conv = A.startActiveConversation(contact, node.getAttribute('data-ch'));
        if (conv) A.openConversation(conv.id);
        break;
      }

      case 'hsm-confirm': {
        var m3 = dom.modalRoot.querySelector('.modal');
        var name = m3.querySelector('[data-role="hsm-name"]').value;
        var tpl = hsmByName(name);
        var hint3 = m3.querySelector('[data-role="hint"]');
        if (!tpl) {
          hint3.className = 'hint hint--err';
          hint3.textContent = 'Selecione um modelo aprovado para enviar.';
          break;
        }
        var vals = hsmFieldValues(m3);
        var missing = false;
        vals.forEach(function (v) { if (!v) missing = true; });
        if (tpl.fields.length && (missing || vals.length !== tpl.fields.length)) {
          hint3.className = 'hint hint--err';
          hint3.textContent = 'Preencha todos os campos do modelo antes de enviar.';
          break;
        }
        closeModal();
        A.sendTemplate(id, name, vals);
        break;
      }
      case 'sim-toggle':   A.toggleSimulation(); break;
      case 'layout-menu': S.layoutOpen = !S.layoutOpen; A.changed(); break;
      case 'layout-set':  S.layoutOpen = false; A.setLayout(node.getAttribute('data-n')); break;
      case 'theme-toggle': A.toggleTheme(); break;
      case 'op-pause':     A.toggleOperatorPause(); break;
      case 'op-logout':    openLogoutModal(); break;
      case 'op-logout-confirm': closeModal(); A.logout(); break;
      case 'op-login':     A.loginBack(); break;

      case 'emoji': {
        var conv = sel.byId(id);
        if (!conv) break;
        var willOpen = !conv.ui.emojiOpen;
        S.conversations.forEach(function (c) { c.ui.emojiOpen = false; });
        conv.ui.emojiOpen = willOpen;
        A.changed();
        break;
      }

      case 'emoji-pick': {
        var c2 = sel.byId(id);
        var el = cards[id];
        var input = el ? el.querySelector('[data-role="input"]') : null;
        if (!c2 || !input) break;
        input.value = input.value + node.dataset.emoji;
        c2.ui.draft = input.value;
        autoGrow(input);
        input.focus();
        A.changed();
        break;
      }

      case 'file': {
        var el2 = cards[id];
        if (el2) el2.querySelector('[data-role="file"]').click();
        break;
      }

      case 'modal-close': closeModal(); break;

      case 'tabular-confirm': {
        var modal = dom.modalRoot.querySelector('.modal');
        var cat = modal.querySelector('[data-role="cat"]').value;
        var reason = modal.querySelector('[data-role="reason"]').value;
        var result = modal.querySelector('[data-role="result"]').value;
        var note = modal.querySelector('[data-role="note"]').value;
        var hint = modal.querySelector('[data-role="hint"]');
        if (!cat || !reason || !result) {
          hint.className = 'hint hint--err';
          hint.textContent = 'Selecione categoria, motivo e resultado para confirmar a tabulação.';
          break;
        }
        closeModal();
        A.tabulateConversation(id, { by: 'operator', category: cat, reason: reason, result: result, note: note });
        break;
      }

      case 'transfer-confirm': {
        var m2 = dom.modalRoot.querySelector('.modal');
        var queue = m2.querySelector('[data-role="queue"]').value;
        var agent = m2.querySelector('[data-role="agent"]').value;
        var note2 = m2.querySelector('[data-role="note"]').value;
        var hint2 = m2.querySelector('[data-role="hint"]');
        if (!queue || !agent) {
          hint2.className = 'hint hint--err';
          hint2.textContent = 'Selecione a fila e o operador de destino para transferir.';
          break;
        }
        closeModal();
        A.transferConversation(id, { queue: queue, agent: agent, note: note2 });
        break;
      }
    }
  }

  function bind() {
    /* clique global (delegação) */
    document.addEventListener('click', function (ev) {
      var actNode = ev.target.closest('[data-act]');
      if (actNode) {
        ev.stopPropagation();
        handleAction(actNode.dataset.act, actNode.dataset.id, actNode);
        return;
      }

      var metric = ev.target.closest('[data-metric]');
      if (metric) { A.setFilter(metric.dataset.metric); return; }

      var chip = ev.target.closest('[data-filter]');
      if (chip) { A.setFilter(chip.dataset.filter); return; }

      var item = ev.target.closest('.conv');
      if (item) {
        if (sel.isOpen(item.dataset.id)) focusCard(item.dataset.id);
        else A.openConversation(item.dataset.id);
        return;
      }

      if (ev.target.closest('#bellBtn')) return;
      if (!ev.target.closest('#bellPanel')) {
        dom.bellPanel.hidden = true;
        dom.bellBtn.setAttribute('aria-expanded', 'false');
      }
      if (!ev.target.closest('.popover')) {
        var any = closeMenus();
        if (S.layoutOpen && !ev.target.closest('[data-act="layout-menu"]')) { S.layoutOpen = false; any = true; }
        if (S.smartOpen && !ev.target.closest('[data-act="smart-config"]')) { S.smartOpen = false; any = true; }
        S.conversations.forEach(function (c) { if (c.ui.emojiOpen) { c.ui.emojiOpen = false; any = true; } });
        if (any) A.changed();
      }
      if (ev.target.dataset && ev.target.dataset.role === 'overlay') closeModal();
    });

    /* teclado na lista */
    dom.convList.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var item = ev.target.closest('.conv');
      if (!item) return;
      ev.preventDefault();
      if (sel.isOpen(item.dataset.id)) focusCard(item.dataset.id);
      else A.openConversation(item.dataset.id);
    });

    /* composer: digitação, Enter, Shift+Enter */
    document.addEventListener('input', function (ev) {
      var t = ev.target;
      if (t.dataset && t.dataset.role === 'input') {
        var conv = sel.byId(t.dataset.id);
        if (conv) conv.ui.draft = t.value;
        autoGrow(t);
        var card = cards[t.dataset.id];
        if (card) card.querySelector('.send-btn').disabled = !t.value.trim() && !(conv && conv.ui.attachment);
        SO.bus.emit('draft');
      }
      /* modais de conversa ativa */
      if (t.dataset && t.dataset.role === 'hsm-field') renderHsm();
      if (t.dataset && t.dataset.role === 'ct-term') contactResults();
      if (t.dataset && t.dataset.role === 'smart-seconds') A.setSmartConfig({ seconds: t.value });
      if (t.dataset && t.dataset.role === 'smart-max') A.setSmartConfig({ max: t.value });
    });

    document.addEventListener('keydown', function (ev) {
      var t = ev.target;
      if (t.dataset && t.dataset.role === 'input' && ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        submitFromInput(t.dataset.id);
        return;
      }
      if (ev.key === 'Escape') {
        if (dom.modalRoot.innerHTML) { closeModal(); return; }
        if (!dom.bellPanel.hidden) { dom.bellPanel.hidden = true; return; }
        var any = closeMenus();
        S.conversations.forEach(function (c) { if (c.ui.emojiOpen) { c.ui.emojiOpen = false; any = true; } });
        if (any) A.changed();
      }
    });

    /* anexos e selects dos modais */
    document.addEventListener('change', function (ev) {
      var t = ev.target;
      if (t.dataset && t.dataset.role === 'file' && t.files && t.files[0]) {
        A.attachFile(t.dataset.id, t.files[0]);
        t.value = '';
      }
      if (t.dataset && t.dataset.role === 'hsm-name') renderHsm();
      if (t.dataset && t.dataset.role === 'smart-on') A.setSmartConfig({ enabled: t.checked });
      if (t.dataset && t.dataset.role === 'ct-fid') contactResults();
    });

    /* pesquisa */
    dom.searchInput.addEventListener('input', function () {
      dom.searchClear.hidden = !dom.searchInput.value;
      A.setSearch(dom.searchInput.value);
    });
    dom.searchClear.addEventListener('click', function () {
      dom.searchInput.value = '';
      dom.searchClear.hidden = true;
      A.setSearch('');
      dom.searchInput.focus();
    });

    /* topbar */
    dom.bellBtn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var open = dom.bellPanel.hidden;
      dom.bellPanel.hidden = !open;
      dom.bellBtn.setAttribute('aria-expanded', String(open));
      if (open) renderBell();
    });

    /* redimensionar a janela muda a altura útil da conversa */
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(scrollAllToBottom, 160);
    });

    SO.bus.on('changed', render);
    SO.bus.on('focus-card', function (id) { setTimeout(function () { focusCard(id); }, 30); });
    SO.bus.on('limit-reached', function () {
      dom.workspace.querySelectorAll('.card').forEach(function (c) {
        c.classList.add('card--nudge');
        setTimeout(function () { c.classList.remove('card--nudge'); }, 700);
      });
    });
  }

    renderLogout();
  }

  function renderLogout() {
    if (!S.loggedOut) {
      if (dom.modalRoot.querySelector('.modal--out')) closeModal();
      return;
    }
    dom.modalRoot.innerHTML =
      '<div class="overlay overlay--solid">' +
        '<div class="modal modal--out" role="dialog" aria-modal="true" aria-label="Sessão encerrada">' +
          '<div class="modal__body" style="text-align:center;gap:14px;padding:26px 20px">' +
            '<span class="empty__ic" style="margin:0 auto">' + ic('logout') + '</span>' +
            '<h3 style="margin:0;font-size:15px;font-weight:500">Sessão encerrada</h3>' +
            '<p style="margin:0;font-size:12px;color:var(--text-dim)">' +
              'Você saiu do Super Operador. Os atendimentos seguem na fila da IA.</p>' +
          '</div>' +
          '<div class="modal__foot" style="justify-content:center">' +
            '<button type="button" class="btn btn--primary" data-act="op-login">' +
              ic('user', 'icon--sm') + 'Entrar novamente</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function init() {
    dom = {
      ident: document.getElementById('ident'),
      rail: document.getElementById('rail'),
      bellBtn: document.getElementById('bellBtn'),
      bellPanel: document.getElementById('bellPanel'),
      metrics: document.getElementById('metrics'),
      filters: document.getElementById('filters'),
      convList: document.getElementById('convList'),
      listCount: document.getElementById('listCount'),
      workspace: document.getElementById('workspace'),
      searchInput: document.getElementById('searchInput'),
      searchClear: document.getElementById('searchClear'),
      modalRoot: document.getElementById('modalRoot')
    };

    document.getElementById('searchIcon').innerHTML = ic('search', 'icon--sm');
    document.getElementById('searchClear').innerHTML = ic('close', 'icon--sm');
    document.querySelector('.sidebar__new').innerHTML = ic('search_add');
    document.getElementById('filtersLabel').innerHTML = ic('filter', 'icon--sm') + ' Filtros';

    bind();
    setInterval(function () { tickSla(); tickSmart(); }, 1000);
    render();
  }

  return { init: init, render: render, focusCard: focusCard };
})();
</script>
<script>
/* Simulador: gera as conversas, mudanças de sentimento, alertas e tabulações. */
window.SO = window.SO || {};

SO.simulator = (function () {
  var S = SO.state;
  var A = SO.actions;
  var sel = SO.select;

  var TICK = 900;
  var lastTick = Date.now();
  var events = [];

  var ALERT_KINDS = ['sla', 'no_answer'];

  /* ------------------------------------------------- roteiro da conversa */
  /* desdobramentos sorteados por atendimento + encerramento */
  function buildExtra() {
    var pool = SO.data.followups.slice();
    var lines = [];
    var rounds = 2 + Math.floor(Math.random() * 3);
    for (var i = 0; i < rounds && pool.length; i++) {
      lines = lines.concat(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return lines.concat(SO.data.filler);
  }

  function nextLine(conv) {
    if (conv.cursor < conv.script.length) return conv.script[conv.cursor++];
    if (!conv.extra) conv.extra = buildExtra();
    var idx = conv.cursor - conv.script.length;
    if (idx < conv.extra.length) {
      conv.cursor++;
      return conv.extra[idx];
    }
    return null;
  }

  /* espia a PRÓXIMA linha sem consumi-la — usado para saber se a IA está
     prestes a mandar mais de uma mensagem seguida (envio inteligente). */
  function peekLine(conv) {
    if (conv.cursor < conv.script.length) return conv.script[conv.cursor];
    if (!conv.extra) conv.extra = buildExtra();
    var idx = conv.cursor - conv.script.length;
    return idx < conv.extra.length ? conv.extra[idx] : null;
  }

  function aiEligible(conv) {
    /* na conversa ativa a IA fica muda até o cliente responder */
    if (conv.awaitingFirstReply || (conv.active && !conv.firstReplyDone)) return false;
    return conv.owner === 'ai' && conv.aiState === 'active' && !conv.tabulation && !conv.transfer;
  }


  /* fim do roteiro: o cliente retoma o contato e o ciclo recomeça, para a
     simulação nunca parar (sem precisar recarregar a tela). A IA não tabula
     sozinha — finalizar é decisão do operador. */
  function restartCycle(conv) {
    if (conv.messages.length > 100) conv.messages.splice(0, conv.messages.length - 60);
    conv.cursor = 0;
    conv.extra = null;
    conv.waitingCustomer = false;
    A.system(conv, 'Cliente retomou o contato · nova interação no mesmo protocolo');
    conv.nextEventAt = Date.now() + 5000 + Math.random() * 7000;
    A.changed();
  }


  /* a fila se repõe: novo atendimento entra alguns segundos depois */
  var TARGET_POOL = 12;
  var nextSpawnAt = 0;

  function spawnIfNeeded(now) {
    if (S.conversations.length >= TARGET_POOL) return;
    if (!nextSpawnAt) {
      nextSpawnAt = now + 6000 + Math.floor(Math.random() * 9000);
      return;
    }
    if (now < nextSpawnAt) return;
    nextSpawnAt = 0;

    var used = S.conversations.map(function (c) { return c.name; });
    var conv = SO.data.spawn(used);
    S.conversations.push(conv);
    A.notify('info', 'Novo atendimento na fila', conv.name);
    A.toast('info', 'Novo atendimento na fila',
      conv.name + ' · ' + (sel.channels[conv.channel] || {}).label);
    A.changed();
  }


  /* a IA responde com o que o operador ensinou, quando o pedido é parecido */
  function fromKnowledge(conv) {
    if (!SO.knowledge.count()) return null;
    var last = null;
    for (var i = conv.messages.length - 1; i >= 0; i--) {
      if (conv.messages[i].author === 'customer') { last = conv.messages[i]; break; }
    }
    if (!last) return null;
    if (conv.usedKnowledge === last.id) return null;   /* uma vez por pergunta */

    var item = SO.knowledge.match(last.text);
    if (!item) return null;

    conv.usedKnowledge = last.id;
    item.used += 1;
    return item;
  }

  /* entrega uma fala da IA e, se o roteiro tiver outra linha 'a' logo em
     seguida (sem fala do cliente no meio), encadeia — é assim que a IA
     "responde mais de uma mensagem seguida": com envio inteligente ligado,
     elas entram no mesmo grupo; desligado, saem em sequência rápida. */
  function deliverAiLine(conv, line) {
    if (S.smartSend.enabled) {
      A.queueSmart(conv, line[1], line[2]);
      if (!conv.smart) return; /* o grupo já saiu por ter batido o máximo */
    } else {
      A.appendMessage(conv, 'ai', line[1]);
      if (line[2]) conv.sentiment = line[2];
      A.changed();
    }
    chainNextAiLine(conv);
  }

  function chainNextAiLine(conv) {
    var peek = peekLine(conv);
    if (!peek || peek[0] !== 'a') return;
    conv.typing = true;
    A.changed();
    setTimeout(function () {
      if (!aiEligible(conv) || !S.simRunning) {
        conv.typing = false;
        A.changed();
        return;
      }
      conv.typing = false;
      deliverAiLine(conv, nextLine(conv));
    }, 650 + Math.random() * 750);
  }

  function deliver(conv) {
    /* antes do roteiro: a base tem resposta para o que o cliente acabou de pedir? */
    var taught = fromKnowledge(conv);
    if (taught) {
      conv.typing = true;
      A.changed();
      conv.nextEventAt = Date.now() + 5000 + Math.random() * 5000;
      setTimeout(function () {
        if (!aiEligible(conv) || !S.simRunning) {
          conv.typing = false;
          A.changed();
          return;
        }
        conv.typing = false;
        A.appendMessage(conv, 'ai', taught.answer, 'text', { fromKnowledge: taught.topic });
        A.changed();
      }, 900 + Math.random() * 1200);
      return;
    }

    var line = nextLine(conv);

    /* roteiro terminou: o cliente retoma o contato e o ciclo recomeça */
    if (!line) {
      restartCycle(conv);
      return;
    }

    conv.nextEventAt = Date.now() + 4000 + Math.random() * 6000;

    if (line[0] === 'a') {
      conv.typing = true;
      A.changed();
      setTimeout(function () {
        if (!aiEligible(conv) || !S.simRunning) {
          conv.typing = false;
          A.changed();
          return;
        }
        conv.typing = false;
        deliverAiLine(conv, line);
      }, 900 + Math.random() * 1400);
    } else {
      conv.waitingCustomer = false;
      A.appendMessage(conv, 'customer', line[1]);
      if (line[2]) conv.sentiment = line[2];
      A.changed();
    }
  }

  /* primeira resposta do cliente numa conversa ativa: é ela que libera a IA */
  function deliverFirstReply(conv) {
    conv.pendingReplyAt = null;
    conv.awaitingFirstReply = false;
    conv.firstReplyDone = true;

    A.appendMessage(conv, 'customer', SO.util.pick(SO.data.firstReplies));
    conv.owner = 'ai';
    conv.aiState = 'active';
    conv.waitingCustomer = false;
    conv.cursor = 1;                /* a 1ª fala do roteiro já foi a resposta */
    conv.nextEventAt = Date.now() + 2500;

    A.system(conv, 'Cliente respondeu · IA assumiu a condução da conversa', 'ok');
    A.notify('ok', 'Cliente respondeu · IA assumiu', conv.name);
    A.toast('ok', 'Cliente respondeu', conv.name + ' — a IA assumiu a conversa.');
    A.changed();
  }

  /* --------------------------------------------------- eventos agendados */
  function at(offset, fn) {
    events.push({ at: Date.now() + offset, fn: fn, done: false });
  }

  function findBy(prop) {
    for (var i = 0; i < S.conversations.length; i++) {
      if (S.conversations[i][prop]) return S.conversations[i];
    }
    return null;
  }

  function randomEligible(test) {
    var pool = S.conversations.filter(function (c) { return aiEligible(c) && (!test || test(c)); });
    return pool.length ? SO.util.pick(pool) : null;
  }

  function scheduleDemo() {
    /* Cenário principal: o cliente se irrita (sentimento, vindo da fala dele) e
       a IA não resolve (alerta, vindo do problema). Dois eixos, mesmo caso. */
    var target = findBy('escalate');

    if (target) {
      at(13000, function () {
        if (!aiEligible(target)) return;
        A.appendMessage(target, 'customer', SO.data.escalation[0][1]);
        target.sentiment = 'impacted';
        A.triggerAlert(target.id, 'upset');
      });

      at(20000, function () {
        if (!aiEligible(target)) return;
        A.appendMessage(target, 'ai', SO.data.escalation[1][1]);
        A.changed();
      });

      at(29000, function () {
        if (!aiEligible(target)) return;
        A.appendMessage(target, 'customer', SO.data.escalation[2][1]);
        target.sentiment = 'critical';
        A.escalateAlert(target.id, 'wants_human');
      });
    }

    /* Segundo alerta, para mostrar múltiplos pisca-piscas na lista. */
    at(78000, function () {
      var conv = randomEligible(function (c) { return !c.alert.active; });
      if (conv) A.triggerAlert(conv.id, SO.util.pick(ALERT_KINDS));
    });
  }

  /* ------------------------------------------------- eventos recorrentes */
  var lastAlert = Date.now();

  /* Problemas acontecem independentemente do humor do cliente: o alvo é
     sorteado entre os atendimentos ativos, sem olhar sentimento. */
  function recurring(now) {
    var active = S.conversations.filter(function (c) { return c.alert.active; }).length;
    if (now - lastAlert > 60000 && active < 4) {
      lastAlert = now;
      var target = randomEligible(function (c) { return !c.alert.active; });
      if (target) A.triggerAlert(target.id, SO.util.pick(ALERT_KINDS));
    }
  }

  /* ------------------------------------------------------------ loop */
  function tick() {
    var now = Date.now();
    var gap = now - lastTick;

    /* simulação pausada ou aba em background: empurra os agendamentos */
    if (!S.simRunning || gap > TICK * 4) {
      var shift = gap;
      S.conversations.forEach(function (c) {
        c.nextEventAt += shift;
        if (c.pendingReplyAt) c.pendingReplyAt += shift;
        if (c.closingAt) c.closingAt += shift;
        if (c.smart) c.smart.dueAt += shift;
        /* o relógio de SLA congela junto com a simulação */
        if (c.awaitingSince) c.awaitingSince = new Date(c.awaitingSince.getTime() + shift);
      });
      events.forEach(function (e) { if (!e.done) e.at += shift; });
      lastAlert += shift;
      if (nextSpawnAt) nextSpawnAt += shift;
      lastTick = now;
      if (!S.simRunning) return;
    }
    lastTick = now;

    events.forEach(function (e) {
      if (!e.done && now >= e.at) {
        e.done = true;
        e.fn();
      }
    });

    /* envio inteligente: o tempo acabou, o grupo vai embora */
    S.conversations.forEach(function (c) {
      if (c.smart && !c.smart.editing && now >= c.smart.dueAt) A.flushSmart(c.id);
    });

    /* atendimentos tabulados saem da tela */
    S.conversations.slice().forEach(function (c) {
      if (c.closingAt && now >= c.closingAt) A.finishConversation(c.id);
    });

    spawnIfNeeded(now);

    S.conversations.slice().forEach(function (conv) {
      /* conversa ativa aguardando a primeira resposta do cliente */
      if (conv.pendingReplyAt && now >= conv.pendingReplyAt) {
        deliverFirstReply(conv);
        return;
      }
      /* enquanto um grupo do envio inteligente está aberto, não busca a
         próxima linha do roteiro — senão a resposta do cliente poderia
         aparecer antes da mensagem (ainda não enviada) da IA */
      if (aiEligible(conv) && !conv.smart && now >= conv.nextEventAt) deliver(conv);
    });

    recurring(now);
  }

  function start() {
    scheduleDemo();
    setInterval(tick, TICK);
  }

  return { start: start };
})();
</script>
<script>
/* Bootstrap do protótipo. */
(function () {
  function boot() {
    SO.state.conversations = SO.data.build();

    /* abre dois atendimentos para a tela já iniciar com contexto */
    SO.state.openIds = ['atd1', 'atd4'].filter(function (id) { return !!SO.select.byId(id); });

    document.documentElement.setAttribute('data-so-theme', SO.state.theme);
    SO.ui.init();
    SO.simulator.start();

    SO.actions.notify('alert', SO.data.alertKinds.sla.label, 'Carlos Eduardo');
    SO.actions.notify('alert', SO.data.alertKinds.churn.label, 'Rodrigo Nunes');

    setTimeout(function () {
      SO.actions.toast('info', 'Monitoramento ativo',
        SO.state.conversations.length + ' atendimentos conduzidos pela IA. Abra até 4 para acompanhar em paralelo.');
    }, 600);

    SO.ui.render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
