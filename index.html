    'Tatiane Moura', 'Everton Ribeiro', 'Cristina Bueno', 'Wesley Cardoso',
    'Natália Camargo', 'Fábio Junqueira', 'Bianca Portela', 'Leandro Vasques',
    'Adriana Ortiz', 'Murilo Bastos', 'Silvana Rezende', 'Danilo Peixoto'
  ];

  var NEW_CAMPAIGNS = ['S - Produtos', 'S - Financeiro', 'S - Suporte N1',
    'S - Vendas', 'S - Cobrança', 'S - Retenção'];

  var NEW_CHANNELS = ['whatsapp', 'whatsapp', 'wa_api', 'telegram', 'webchat', 'facebook', 'email'];

  var spawnCount = 0;

  function randomPhone() {
    var ddd = SO.util.pick(['11', '21', '31', '41', '47', '51', '62', '71', '85']);
    return '+55 ' + ddd + ' 9' + String(1000 + Math.floor(Math.random() * 8999)) +
      '-' + String(1000 + Math.floor(Math.random() * 8999));
  }

  function spawn(usedNames) {
    spawnCount += 1;
    var pool = NEW_NAMES.filter(function (n) { return usedNames.indexOf(n) === -1; });
    var name = pool.length ? SO.util.pick(pool) : SO.util.pick(NEW_NAMES);
    var scriptKey = SO.util.pick(Object.keys(SCRIPTS));
    var script = SCRIPTS[scriptKey];
    var channel = SO.util.pick(NEW_CHANNELS);
    var seed = 1 + Math.floor(Math.random() * 2);   /* começa com 1 ou 2 falas */
    var now = Date.now();
    var step = 20000;

    var conv = {
      id: SO.util.uid('atd'),
      name: name,
      phone: channel === 'email'
        ? name.toLowerCase().split(' ')[0] + '.' + name.toLowerCase().split(' ').pop() + '@mail.com'
        : randomPhone(),
      channel: channel,
      campaign: SO.util.pick(NEW_CAMPAIGNS),
      protocol: newProtocol(),
      avatarColor: avatarColor(spawnCount + 5),
      startedAt: new Date(now - seed * step),
      aiState: 'active',
      owner: 'ai',
      sentiment: 'stable',
      priority: 'normal',
      waitingCustomer: false,
      tabulation: null,
      transfer: null,
      alert: { active: false, kind: null, reason: '', since: null },
      script: script,
      cursor: seed,
      extra: null,
      autoTabulate: false,
      escalate: false,
      typing: false,
      messages: [],
      ui: { draft: '', emojiOpen: false, menuOpen: false, attachment: null, recording: null },
      nextEventAt: now + 3000 + Math.floor(Math.random() * 6000),
      lastActivity: now,
      awaitingSince: null,
      unread: 0,
      closingAt: null
    };

    conv.messages.push({
      id: SO.util.uid('m'), author: 'system',
      text: 'Conversa iniciada por [' + name + '], protocolo: ' + conv.protocol,
      at: new Date(now - seed * step), kind: 'system'
    });

    for (var k = 0; k < seed; k++) {
      var line = script[k];
      conv.messages.push({
        id: SO.util.uid('m'),
        author: line[0] === 'a' ? 'ai' : 'customer',
        text: line[1],
        at: new Date(now - (seed - k - 1) * step - 4000),
        kind: 'text'
      });
      if (line[2]) conv.sentiment = line[2];
    }

    var last = conv.messages[conv.messages.length - 1];
    if (last.author === 'customer') conv.awaitingSince = last.at;

    return conv;
  }

  var AUTHORS = { c: 'customer', a: 'ai', o: 'operator' };

  function build() {
    var now = Date.now();

    return RAW.map(function (r, i) {
      var script = SCRIPTS[r.script];
      var seed = Math.min(r.seed, script.length);

      /* o sentimento vem da conversa: última fala semeada que carrega sentimento */
      var sentiment = 'stable';
      for (var s = 0; s < seed; s++) {
        if (script[s][2]) sentiment = script[s][2];
      }
      var startedAt = now - r.startedMinutesAgo * 60000;
      var span = Math.max(60000, r.startedMinutesAgo * 60000 - 60000);
      var step = span / Math.max(seed, 1);

      var conv = {
        id: 'atd' + (i + 1),
        name: r.name,
        phone: r.phone,
        channel: r.channel,
        campaign: r.campaign,
        protocol: r.protocol,
        avatarColor: AV[i % AV.length],
        startedAt: new Date(startedAt),
        aiState: r.aiState || 'active',
        owner: r.owner || 'ai',
        sentiment: sentiment,
        priority: r.alertKind ? ALERT_KINDS[r.alertKind].severity : 'normal',
        waitingCustomer: !!r.waiting,
        tabulation: r.tabulation || null,
        transfer: null,
        alert: {
          active: !!r.alertKind,
          kind: r.alertKind || null,
          reason: r.alertKind ? ALERT_KINDS[r.alertKind].reason : '',
          since: r.alertKind ? new Date(now - 120000) : null
        },
        script: script,
        cursor: seed,
        autoTabulate: !!r.autoTabulate,
        escalate: !!r.escalate,
        escalationStep: 0,
        typing: false,
        messages: [],
        ui: { draft: '', emojiOpen: false, menuOpen: false, attachment: null, recording: null },
        awaitingSince: null,   /* relógio de resposta ao cliente (SLA) */
        nextEventAt: now + 2500 + Math.floor(Math.random() * 9000),
        lastActivity: startedAt
      };

      function push(author, text, at, kind, meta) {
        var m = {
          id: SO.util.uid('m'),
          author: author,
          text: text,
          at: new Date(at),
          kind: kind || 'text'
        };
        if (meta) m.meta = meta;
        conv.messages.push(m);
        conv.lastActivity = at;
        return m;
      }

      push('system', 'Conversa iniciada por [' + r.name + '], protocolo: ' + r.protocol, startedAt, 'system');

      for (var k = 0; k < seed; k++) {
        push(AUTHORS[script[k][0]], script[k][1], startedAt + step * (k + 1));
      }

      var tail = conv.lastActivity;

      if (r.alertKind) {
        push('system', 'Alerta gerado pela IA: ' + ALERT_KINDS[r.alertKind].reason,
          tail + 15000, 'system', { kind: 'alert' });
        tail += 15000;
      }

      if (r.owner === 'operator') {
        push('system', 'Atendimento assumido por ' + SO.state.currentUser.name + ' — IA pausada', tail + 18000, 'system');
        if (r.operatorLine) push('operator', r.operatorLine, tail + 36000, 'text');
        tail += 40000;
      }

      if (r.tabulation) {
        var t = r.tabulation;
        push('system',
          'Atendimento tabulado pel' + (t.by === 'ai' ? 'a IA' : 'o operador') +
          ' · ' + t.category + ' › ' + t.reason + ' › ' + t.result,
          tail + 22000, 'system', { kind: 'ok' });
      }

      /* SLA: o relógio só corre enquanto o cliente espera resposta */
      var lastTalk = null;
      for (var j = conv.messages.length - 1; j >= 0; j--) {
        if (conv.messages[j].author !== 'system') { lastTalk = conv.messages[j]; break; }
      }
      if (lastTalk && lastTalk.author === 'customer' && !conv.tabulation) {
        var wait = r.alertKind === 'sla' ? SLA.burst + 18 : 5 + Math.floor(Math.random() * 40);
        conv.awaitingSince = new Date(now - wait * 1000);
      }

      return conv;
    });
  }

  return {
    build: build,
    contacts: CONTACTS,
    contactFields: CONTACT_FIELDS,
    hsm: HSM,
    firstReplies: FIRST_REPLIES,
    newProtocol: newProtocol,
    spawn: spawn,
    avatarColor: avatarColor,
    sla: SLA,
    alertKinds: ALERT_KINDS,
    scripts: SCRIPTS,
    filler: FILLER,
    followups: FOLLOWUPS,
    escalation: ESCALATION,
    emojis: ['😊', '👍', '🙏', '😀', '😂', '🥰', '😍', '🤝', '👏', '💙', '✅', '⚠️',
             '📌', '📎', '📞', '⏰', '🚀', '🎯', '💡', '🔎', '📄', '💳', '🛒', '📦',
             '🙌', '😅', '😔', '❤️'],
    queues: ['Suporte N2', 'Retenção', 'Financeiro', 'Vendas — Consultivo', 'Backoffice', 'Supervisão'],
    agents: ['Ana Paula Ferreira', 'Bruno Tavares', 'Carla Menezes', 'Diego Prado', 'Elaine Castro', 'Próximo disponível'],
    tabulation: {
      categories: ['Dúvida', 'Reclamação', 'Solicitação', 'Cancelamento', 'Financeiro', 'Suporte técnico', 'Venda'],
      reasons: ['Status de pedido', 'Segunda via de fatura', 'Cobrança indevida', 'Troca ou devolução',
                'Instabilidade de sinal', 'Reagendamento', 'Mudança de plano', 'Insatisfação com atendimento'],
      results: ['Resolvido', 'Resolvido com orientação', 'Encaminhado ao N2', 'Não resolvido',
                'Cliente desistiu', 'Aguardando terceiros']
    }
  };
})();
</script>
<script>
/* Ações da aplicação: tudo que muda o estado passa por aqui. */
window.SO = window.SO || {};

SO.actions = (function () {
  var S = SO.state;
  var U = SO.util;

  function changed() { SO.bus.emit('changed'); }

  /* Sem avisos flutuantes: o operador já tem muita coisa acontecendo na tela.
     O que importa fica no sino de notificações e no próprio atendimento. */
  function toast() {}

  function notify(kind, title, convName) {
    S.notifications.unshift({
      id: U.uid('n'), kind: kind, title: title, who: convName || '', at: new Date()
    });
    if (S.notifications.length > 14) S.notifications.pop();
  }

  /* -------------------------------------------------------- mensagens */
  function appendMessage(conv, author, text, kind, meta) {
    var m = {
      id: U.uid('m'),
      author: author,
      text: text,
      at: new Date(),
      kind: kind || 'text'
    };
    if (meta) m.meta = meta;
    /* SLA: cliente falando inicia a contagem; IA ou operador respondendo para. */
    if (author === 'customer') {
      conv.awaitingSince = m.at;
    } else if (author === 'ai' || author === 'operator') {
      if (conv.awaitingSince && conv.alert.active && conv.alert.kind === 'sla') {
        conv.alert.respondedIn = Math.max(0, Math.floor((m.at.getTime() - conv.awaitingSince.getTime()) / 1000));
      }
      conv.awaitingSince = null;
    }

    conv.messages.push(m);
    conv.lastActivity = Date.now();
    if (!SO.select.isOpen(conv.id) && author !== 'system') conv.unread = (conv.unread || 0) + 1;
    return m;
  }

  function system(conv, text, kind) {
    return appendMessage(conv, 'system', text, 'system', kind ? { kind: kind } : null);
  }

  /* ------------------------------------------------------------ layout
     Define quantas telas o operador acompanha ao mesmo tempo (1 a 4). */
  function setLayout(n) {
    var max = Math.min(4, Math.max(1, parseInt(n, 10) || 1));
    if (max === S.maxOpenConversations) return;
    S.maxOpenConversations = max;

    /* reduziu o layout: fecha os atendimentos que não cabem mais */
    if (S.openIds.length > max) {
      var closed = S.openIds.splice(max, S.openIds.length - max);
      closed.forEach(function (id) {
        var conv = SO.select.byId(id);
        if (conv) { conv.ui.emojiOpen = false; conv.ui.menuOpen = false; }
      });
      notify('info', 'Layout de ' + max + (max > 1 ? ' telas' : ' tela'),
        closed.length + ' atendimento(s) fechado(s) na visualização');
    }
    changed();
  }

  /* ------------------------------------------------- abrir / fechar */
  function openConversation(id) {
    var conv = SO.select.byId(id);
    if (!conv) return;

    if (SO.select.isOpen(id)) {
      SO.bus.emit('focus-card', id);
      return;
    }

    if (S.openIds.length >= S.maxOpenConversations) {
      /* aviso no próprio grupo da lista, sem pop-up no canto da tela */
      S.limitHintUntil = Date.now() + 6000;
      SO.bus.emit('limit-reached');
      changed();
      return;
    }

    S.openIds.push(id);
    conv.unread = 0;
    changed();
    SO.bus.emit('focus-card', id);
  }

  function closeConversation(id) {
    var idx = S.openIds.indexOf(id);
    if (idx === -1) return;
    S.openIds.splice(idx, 1);
    var conv = SO.select.byId(id);
    if (conv) {
      conv.ui.emojiOpen = false;
      conv.ui.menuOpen = false;
      conv.ui.kbSelection = [];
      if (conv.ui.recording) SO.bus.emit('recording-cancel', id);
      conv.ui.recording = null;
    }
    changed();
  }

  function toggleConversation(id) {
    if (SO.select.isOpen(id)) closeConversation(id); else openConversation(id);
  }

  /* --------------------------------------------------- controle da IA */
  function pauseAI(id, silent) {
    var conv = SO.select.byId(id);
    if (!conv || conv.aiState === 'paused') return;
    conv.aiState = 'paused';
    conv.typing = false;
    if (!silent) {
      system(conv, 'IA pausada por ' + S.currentUser.name);
      toast('warn', 'IA pausada', conv.name + ' — a IA não responderá até ser reativada.');
    }
    changed();
  }

  function startAI(id) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    conv.aiState = 'active';
    conv.owner = 'ai';
    conv.waitingCustomer = false;
    conv.nextEventAt = Date.now() + 2500;
    system(conv, 'IA reativada por ' + S.currentUser.name);
    toast('info', 'IA reativada', conv.name + ' — a IA voltou a responder o cliente.');
    changed();
  }

  function takeOverConversation(id) {
    var conv = SO.select.byId(id);
    if (!conv || conv.owner === 'operator') return;
    conv.owner = 'operator';
    conv.aiState = 'paused';
    conv.typing = false;
    conv.waitingCustomer = false;
    system(conv, 'Atendimento assumido por ' + S.currentUser.name + ' — IA pausada');
    notify('info', 'Atendimento assumido', conv.name);
    toast('info', 'Você assumiu o atendimento', conv.name + ' — a IA foi pausada automaticamente.');
    changed();
  }

  function returnToAI(id) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    conv.owner = 'ai';
    conv.aiState = 'active';
    conv.waitingCustomer = false;
    conv.nextEventAt = Date.now() + 3000;
    system(conv, 'Atendimento devolvido para a IA por ' + S.currentUser.name);
    notify('info', 'Devolvido para a IA', conv.name);
    toast('ok', 'Atendimento devolvido para a IA', conv.name + ' — a IA voltou a conduzir a conversa.');
    changed();
  }

  /* ------------------------------------------------ envio inteligente
     A IA vai escrevendo e as mensagens ficam agrupadas antes de sair. O envio
     acontece quando o tempo acaba ou quando bate o máximo de mensagens; o
     operador ainda pode editar, cancelar ou enviar na hora.
     Cada nova mensagem reinicia a contagem. */
  function smartCfg() { return S.smartSend; }

  function queueSmart(conv, text, sentiment) {
    if (!conv.smart) {
      conv.smart = { parts: [], dueAt: 0, editing: false, sentiment: null };
    }
    conv.smart.parts.push(text);
    if (sentiment) conv.smart.sentiment = sentiment;
    conv.smart.dueAt = Date.now() + smartCfg().seconds * 1000;

    if (conv.smart.parts.length >= smartCfg().max) {
      flushSmart(conv.id);
      return;
    }
    changed();
  }

  function flushSmart(id) {
    var conv = SO.select.byId(id);
    if (!conv || !conv.smart || !conv.smart.parts.length) return;

    var parts = conv.smart.parts.slice();
    var sentiment = conv.smart.sentiment;
    conv.smart = null;

    appendMessage(conv, 'ai', parts.join('\n'), 'text',
      parts.length > 1 ? { grouped: parts.length } : null);
    if (sentiment) conv.sentiment = sentiment;
    changed();
  }

  function cancelSmart(id) {
    var conv = SO.select.byId(id);
    if (!conv || !conv.smart) return;
    var n = conv.smart.parts.length;
    conv.smart = null;
    system(conv, 'Envio inteligente cancelado por ' + S.currentUser.name +
      ' · ' + n + (n > 1 ? ' mensagens descartadas' : ' mensagem descartada'));
    changed();
  }

  function editSmart(id, on) {
    var conv = SO.select.byId(id);
    if (!conv || !conv.smart) return;
    conv.smart.editing = !!on;
    if (!on) conv.smart.dueAt = Date.now() + smartCfg().seconds * 1000;
    changed();
  }

  function saveSmart(id, text) {
    var conv = SO.select.byId(id);
    if (!conv || !conv.smart) return;
    var parts = String(text).split('\n').map(function (t) { return t.trim(); })
      .filter(function (t) { return t.length; });
    if (!parts.length) { cancelSmart(id); return; }
    conv.smart.parts = parts;
    conv.smart.editing = false;
    conv.smart.dueAt = Date.now() + smartCfg().seconds * 1000;
    changed();
  }

  function setSmartConfig(patch) {
    if (typeof patch.enabled === 'boolean') S.smartSend.enabled = patch.enabled;
    if (patch.seconds) S.smartSend.seconds = Math.min(60, Math.max(1, parseInt(patch.seconds, 10) || 5));
    if (patch.max) S.smartSend.max = Math.min(10, Math.max(2, parseInt(patch.max, 10) || 3));

    /* vale também para o que já está agrupado */
    S.conversations.forEach(function (c) {
      if (!c.smart) return;
      if (!S.smartSend.enabled) { flushSmart(c.id); return; }
      if (c.smart.parts.length >= S.smartSend.max) flushSmart(c.id);
    });
    changed();
  }

  /* ------------------------------------------------- envio pelo operador */
  function ensureOperator(conv) {
    if (conv.owner !== 'operator') {
      takeOverConversation(conv.id);
      return true;
    }
    return false;
  }

  function sendMessage(id, text) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    var body = String(text || '').replace(/\s+$/, '');
    var file = conv.ui.attachment;
    if (!body && !file) return;

    /* canal oficial fora da janela de 24h: só modelo aprovado */
    if (conv.requiresTemplate && (!conv.templateSent || conv.awaitingFirstReply)) {
      toast('warn', 'Envio livre bloqueado',
        'WhatsApp Business API: use um modelo de mensagem até o cliente responder.');
      return;
    }

    ensureOperator(conv);

    if (file) {
      appendMessage(conv, 'operator', body || file.name, 'file',
        { fileName: file.name, size: file.size });
      conv.ui.attachment = null;
    } else {
      appendMessage(conv, 'operator', body, 'text');
    }

    conv.ui.draft = '';
    conv.waitingCustomer = true;
    /* conversa ativa em canal sem modelo: a IA também espera a 1ª resposta */
    if (conv.active && !conv.firstReplyDone) armFirstReply(conv);
    changed();
  }

  function sendAudio(id, seconds) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    ensureOperator(conv);
    appendMessage(conv, 'operator', 'Áudio enviado', 'audio', { duration: seconds });
    conv.ui.recording = null;
    changed();
  }

  function attachFile(id, file) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    conv.ui.attachment = {
      name: file.name,
      size: U.fmtSize(Math.max(1, Math.round(file.size / 1024)))
    };
    changed();
  }

  function clearAttachment(id) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    conv.ui.attachment = null;
    changed();
  }

  /* ==================================================== conversa ativa
     Iniciada pelo operador a partir da busca de contato. No WhatsApp
     Business API a primeira mensagem precisa ser um modelo (HSM), e a IA
     só entra depois que o cliente responde. */
  function startActiveConversation(contact, channelKey) {
    var ch = SO.select.channels[channelKey] || {};
    var requires = !!ch.requiresTemplate;
    var idx = S.conversations.length;

    var conv = {
      id: U.uid('atd'),
      name: contact.name,
      phone: channelKey === 'email' ? contact.email : contact.phone,
      channel: channelKey,
      campaign: 'Ativo · Super Operador',
      protocol: SO.data.newProtocol(),
      avatarColor: SO.data.avatarColor(idx + 3),
      startedAt: new Date(),
      aiState: 'paused',
      owner: 'operator',
      sentiment: 'stable',
      priority: 'normal',
      waitingCustomer: false,
      tabulation: null,
      transfer: null,
      alert: { active: false, kind: null, reason: '', since: null },
      script: SO.data.scripts[U.pick(['pedido', 'fatura', 'suporte', 'entrega'])],
      cursor: 0,
      extra: null,
      autoTabulate: false,
      escalate: false,
      typing: false,
      messages: [],
      ui: { draft: '', emojiOpen: false, menuOpen: false, attachment: null, recording: null },
      nextEventAt: Infinity,
      lastActivity: Date.now(),
      awaitingSince: null,
      unread: 0,
      /* estado próprio da conversa ativa */
      active: true,
      contactId: contact.id,
      requiresTemplate: requires,
      templateSent: false,
      awaitingFirstReply: false,
      firstReplyDone: false,
      pendingReplyAt: null
    };

    S.conversations.push(conv);

    system(conv, 'Conversa ativa iniciada por ' + S.currentUser.name +
      ' · canal ' + (ch.label || channelKey));

    if (requires) {
      system(conv, 'Canal oficial: a primeira mensagem precisa ser um modelo aprovado (HSM)', 'alert');
      toast('warn', 'Envie um modelo de mensagem',
        conv.name + ' · WhatsApp Business API exige HSM para abrir a conversa.');
    } else {
      toast('ok', 'Conversa ativa criada',
        conv.name + ' · ' + (ch.label || channelKey) + ' — você pode escrever direto.');
    }
    notify('info', 'Conversa ativa iniciada', conv.name);
    changed();
    return conv;
  }

  /* a partir daqui a IA fica muda até o cliente responder */
  function armFirstReply(conv) {
    if (conv.firstReplyDone) return;
    conv.awaitingFirstReply = true;
    conv.pendingReplyAt = Date.now() + 9000 + Math.floor(Math.random() * 9000);
    conv.aiState = 'paused';
  }

  function renderTemplate(tpl, fields) {
    var body = tpl.body;
    (fields || []).forEach(function (v, i) {
      body = body.split('{{' + (i + 1) + '}}').join(v);
    });
    return body;
  }

  function sendTemplate(id, templateName, fields) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    var tpl = null;
    SO.data.hsm.forEach(function (t) { if (t.name === templateName) tpl = t; });
    if (!tpl) return;

    var body = renderTemplate(tpl, fields);
    appendMessage(conv, 'operator', body, 'template', { template: tpl.name });
    conv.templateSent = true;
    conv.owner = 'operator';
    armFirstReply(conv);

    system(conv, 'Modelo de mensagem enviado · ' + tpl.name);
    notify('info', 'Modelo de mensagem enviado', conv.name);
    toast('ok', 'Modelo enviado', conv.name + ' · ' + tpl.name +
      ' — a IA só responde depois que o cliente escrever.');
    changed();
  }

  /* ------------------------------------------ base de conhecimento da IA
     O operador marca a resposta que deu; ela passa a valer para a IA nos
     próximos atendimentos. Se o alerta era "IA não consegue responder",
     ensinar encerra o alerta — o motivo dele deixou de existir. */
  function sendToKnowledge(convId, messageIds, payload) {
    var conv = SO.select.byId(convId);
    if (!conv) return null;

    var ids = [].concat(messageIds || []);
    var marked = 0;

    var item = SO.knowledge.add({
      question: payload.question,
      answer: payload.answer,
      topic: payload.topic,
      author: S.currentUser.name,
      from: conv.name
    });

    conv.messages.forEach(function (m) {
      if (ids.indexOf(m.id) !== -1 && !m.knowledge) { m.knowledge = item.id; marked++; }
    });

    conv.ui.kbSelection = [];

    system(conv, (marked > 1 ? marked + ' respostas enviadas' : 'Resposta enviada') +
      ' para a base de conhecimento por ' + S.currentUser.name + ' · ' + payload.topic +
      ' — a IA passa a usar em novos atendimentos', 'ok');
    notify('ok', 'Base de conhecimento atualizada', conv.name);

    if (conv.alert.active && conv.alert.kind === 'no_answer') {
      conv.alert = { active: false, kind: null, reason: '', since: null };
      conv.priority = 'normal';
      system(conv, 'Alerta encerrado: a IA agora tem a resposta para esse caso', 'ok');
    }

    changed();
    return item;
  }

  /* ---------------------------------------------------------- tabulação */
  function tabulateConversation(id, payload) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    var by = payload.by || 'operator';
    conv.tabulation = {
      by: by,
      category: payload.category,
      reason: payload.reason,
      result: payload.result,
      note: payload.note || '',
      at: new Date(),
      author: by === 'ai' ? 'IA Voll' : S.currentUser.name
    };
    conv.aiState = 'paused';
    conv.typing = false;
    conv.awaitingSince = null;   /* atendimento encerrado: relógio de SLA para */
    conv.waitingCustomer = false;

    system(conv,
      'Atendimento tabulado pel' + (by === 'ai' ? 'a IA' : 'o operador') +
      ' · ' + payload.category + ' › ' + payload.reason + ' › ' + payload.result, 'ok');

    notify('ok', by === 'ai' ? 'Tabulado automaticamente pela IA' : 'Tabulado pelo operador', conv.name);
    if (by !== 'ai') toast('ok', 'Atendimento tabulado', conv.name + ' · ' + payload.category + ' › ' + payload.result);

    /* tabulou, encerrou: sai da tela em seguida */
    conv.closingAt = Date.now() + 4500;
    changed();
  }

  /* ------------------------------------------------------- finalização
     Tabular = finalizar: o atendimento sai da tela (da lista e da área de
     visualização) alguns segundos depois, para dar tempo de ver o registro. */
  function finishConversation(id) {
    var conv = SO.select.byId(id);
    if (!conv) return;

    var idx = S.openIds.indexOf(id);
    if (idx !== -1) S.openIds.splice(idx, 1);

    var pos = S.conversations.indexOf(conv);
    if (pos !== -1) S.conversations.splice(pos, 1);

    S.finished += 1;
    var by = conv.tabulation && conv.tabulation.by === 'ai' ? 'pela IA' : 'pelo operador';
    notify('ok', 'Atendimento finalizado ' + by, conv.name);
    toast('ok', 'Atendimento finalizado', conv.name + ' foi tabulado ' + by + ' e saiu da tela.');
    changed();
  }

  /* ------------------------------------------------------- transferência */
  function transferConversation(id, payload) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    conv.transfer = {
      queue: payload.queue,
      agent: payload.agent,
      note: payload.note || '',
      at: new Date(),
      by: S.currentUser.name
    };
    conv.aiState = 'paused';
    conv.typing = false;
    conv.owner = 'operator';
    conv.awaitingSince = null;   /* atendimento encerrado: relógio de SLA para */

    system(conv,
      'Transferência solicitada por ' + S.currentUser.name +
      ' · Fila ' + payload.queue + ' › ' + payload.agent, 'ok');

    notify('info', 'Transferência solicitada', conv.name);
    toast('ok', 'Atendimento transferido', conv.name + ' → ' + payload.queue + ' · ' + payload.agent);
    changed();
  }

  /* -------------------------------------------------------------- alertas */
  /* alerta = problema do atendimento. Define a prioridade de intervenção e
     NUNCA mexe no sentimento do cliente — esse vem só do que é dito na conversa. */
  function triggerAlert(id, kind) {
    var conv = SO.select.byId(id);
    if (!conv || conv.alert.active) return;
    var meta = SO.data.alertKinds[kind];
    if (!meta) return;
    conv.alert = { active: true, kind: kind, reason: meta.reason, since: new Date() };
    conv.priority = meta.severity;
    system(conv, 'Alerta gerado pela IA: ' + meta.reason, 'alert');
    notify('alert', meta.label, conv.name);
    toast('danger', meta.label, conv.name + ' — ' + meta.reason);
    changed();
  }

  /* troca a causa de um alerta que já está ativo (a situação piorou) */
  function escalateAlert(id, kind) {
    var conv = SO.select.byId(id);
    var meta = SO.data.alertKinds[kind];
    if (!conv || !conv.alert.active || !meta || conv.alert.kind === kind) return;
    conv.alert.kind = kind;
    conv.alert.reason = meta.reason;
    conv.priority = meta.severity;
    system(conv, 'Alerta atualizado pela IA: ' + meta.reason, 'alert');
    notify('alert', meta.label, conv.name);
    toast('danger', meta.label, conv.name + ' — ' + meta.reason);
    changed();
  }

  function resolveAlert(id) {
    var conv = SO.select.byId(id);
    if (!conv || !conv.alert.active) return;
    /* resolver o problema não muda como o cliente se sente */
    conv.alert = { active: false, kind: null, reason: '', since: null };
    conv.priority = 'normal';
    system(conv, 'Alerta reconhecido e tratado por ' + S.currentUser.name, 'ok');
    notify('ok', 'Alerta resolvido', conv.name);
    toast('ok', 'Alerta resolvido', conv.name + ' — o indicador de atenção foi removido.');
    changed();
  }

  function setSentiment(id, sentiment) {
    var conv = SO.select.byId(id);
    if (!conv) return;
    conv.sentiment = sentiment;
    changed();
  }

  /* ------------------------------------------------------ lista / filtros */
  function setFilter(key) {
    S.filter = key;
    changed();
  }

  function setSearch(term) {
    S.search = term;
    changed();
  }

  function toggleSimulation() {
    S.simRunning = !S.simRunning;
    toast('info', S.simRunning ? 'Simulação retomada' : 'Simulação pausada',
      S.simRunning ? 'Os atendimentos voltaram a receber eventos automáticos.'
                   : 'Nenhum evento automático será gerado até você retomar.');
    changed();
  }

  /* pausa do operador (não confundir com pausar a IA de um atendimento) */
  /* tema da interface: escuro (padrão) ou claro */
  function toggleTheme() {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-so-theme', S.theme);
    toast('info', S.theme === 'light' ? 'Tema claro' : 'Tema escuro',
      'A aparência do Super Operador foi alterada.');
    changed();
  }

  function toggleOperatorPause() {
    S.operatorPaused = !S.operatorPaused;
    S.pausedSince = S.operatorPaused ? new Date() : null;
    if (S.operatorPaused) {
      toast('warn', 'Você entrou em pausa',
        'Nenhum atendimento novo será direcionado para você. Os abertos continuam visíveis.');
    } else {
      toast('ok', 'Pausa encerrada', 'Você voltou a receber atendimentos.');
    }
    changed();
  }

  function logout() {
    S.loggedOut = true;
    S.simRunning = false;
    changed();
  }

  function loginBack() {
    S.loggedOut = false;
    S.simRunning = true;
    changed();
  }

  function markAllNotificationsRead() {
    S.notifications = [];
    changed();
  }

  return {
    appendMessage: appendMessage,
    system: system,
    openConversation: openConversation,
    closeConversation: closeConversation,
    toggleConversation: toggleConversation,
    pauseAI: pauseAI,
    startAI: startAI,
    takeOverConversation: takeOverConversation,
    returnToAI: returnToAI,
    queueSmart: queueSmart,
    flushSmart: flushSmart,
    cancelSmart: cancelSmart,
    editSmart: editSmart,
    saveSmart: saveSmart,
    setSmartConfig: setSmartConfig,
    sendMessage: sendMessage,
    sendAudio: sendAudio,
    attachFile: attachFile,
    clearAttachment: clearAttachment,
    startActiveConversation: startActiveConversation,
    sendTemplate: sendTemplate,
    renderTemplate: renderTemplate,
    armFirstReply: armFirstReply,
    sendToKnowledge: sendToKnowledge,
    tabulateConversation: tabulateConversation,
    finishConversation: finishConversation,
    transferConversation: transferConversation,
    triggerAlert: triggerAlert,
    escalateAlert: escalateAlert,
    resolveAlert: resolveAlert,
    setSentiment: setSentiment,
    setFilter: setFilter,
    setSearch: setSearch,
    toggleSimulation: toggleSimulation,
    setLayout: setLayout,
    toggleTheme: toggleTheme,
    toggleOperatorPause: toggleOperatorPause,
    logout: logout,
    loginBack: loginBack,
    markAllNotificationsRead: markAllNotificationsRead,
    notify: notify,
    toast: toast,
    changed: changed
  };
})();
</script>
<script>
/* Camada de renderização: lista, métricas, cards e modais. */
window.SO = window.SO || {};

SO.ui = (function () {
  var S = SO.state;
  var U = SO.util;
  var A = SO.actions;
  var sel = SO.select;
  var ic = SO.icons.icon;

  var dom = {};
  var cards = {};       /* id -> elemento do card */
  var recTimers = {};   /* id -> setInterval da gravação */

  /* ==================================================================== */
  /* ==================================================================== */
  function tag(cls, label, icon, live) {
    return '<span class="tag ' + cls + '">' +
      (icon ? ic(icon) : '') + U.esc(label) + '</span>';
  }

  /* "IA respondendo" é o estado padrão do ambiente — só mostramos o que foge dele */
  function statusTag(conv) {
    var st = sel.statusOf(conv);
    if (st.key === 'ia_ativa') return '';
    return tag(st.cls, st.label, st.icon);
  }

  function sentimentTag(conv) {
    var s = sel.sentimentOf(conv);
    return '<span class="tag tag--sent tag--sent-' + s.tone + '" title="Sentimento do cliente">' +
      SO.icons.face(s.tone) + U.esc(s.label) + '</span>';
  }

  function priorityTag(conv) {
    /* com alerta ativo a badge de prioridade repetiria a informação */
    if (conv.priority === 'normal' || conv.alert.active) return '';
    var p = sel.priorityOf(conv);
    return tag(p.cls, 'Prioridade: ' + p.label, conv.priority === 'critical' ? 'alert' : 'info');
  }

  /* A tag diz o motivo do alerta. Vermelha só para o que exige intervenção
     humana; os demais ficam em âmbar. O SLA não usa tag: quem avisa é o relógio. */
  function alertTag(conv) {
    if (!conv.alert.active) return '';
    var kind = SO.data.alertKinds[conv.alert.kind] || {};
    if (kind.tone === 'none') return '';
    var a = sel.alertMeta(conv);
    return '<span class="tag ' + (kind.tone === 'warning' ? 'tag--alert-warn' : 'tag--alert') +
      '" title="' + U.esc(a.reason) + '">' +
      ic('alert') + U.esc(a.label.toUpperCase()) + '</span>';
  }

  function menuItem(id, act, icon, label, kind) {
    return '<button type="button" class="menu-item' + (kind ? ' menu-item--' + kind : '') +
      '" data-act="' + act + '" data-id="' + id + '">' + ic(icon, 'icon--sm') + U.esc(label) + '</button>';
  }

  /* ------------------------------------------------------------------ SLA
     Relógio de resposta: começa quando o cliente fala, para quando a IA ou o
     operador responde. Três estágios por tempo de espera: verde, amarelo
     (atenção) e vermelho (estourado — aí nasce o alerta de SLA). */
  function slaStage(secs) {
    var s = SO.data.sla;
    return secs >= s.burst ? 'red' : secs >= s.warn ? 'yellow' : 'green';
  }

  function slaState(conv) {
    if (conv.awaitingSince) {
      var secs = Math.max(0, Math.floor((Date.now() - conv.awaitingSince.getTime()) / 1000));
      return {
        show: true, running: true, secs: secs, stage: slaStage(secs),
        pct: Math.min(100, Math.round(secs / SO.data.sla.burst * 100))
      };
    }
    /* já foi respondido: só continua visível se o SLA havia estourado */
    if (conv.alert.active && conv.alert.kind === 'sla') {
      return { show: true, running: false, secs: conv.alert.respondedIn || 0, stage: 'red', pct: 100 };
    }
    return { show: false, running: false, secs: 0, stage: 'green', pct: 0 };
  }


  function slaAvClass(st) {
    if (!st.show) return '';
    return 'av--sla av--sla-' + st.stage + (st.running ? '' : ' av--sla-stopped');
  }

  /* o anel enche conforme o tempo de espera; no vermelho ele passa a girar */
  function slaAvStyle(st) {
    return st.show ? '; --sla-pct:' + st.pct : '';
  }


  function avatar(conv, cls, extra, style) {
    var ch = sel.channelOf(conv);
    return '<span class="' + cls + (extra ? ' ' + extra : '') +
      '" data-sla-av="' + conv.id +
      '" style="--av:' + conv.avatarColor + (style || '') + '">' +
      U.esc(U.initials(conv.name)) +
      '<span class="conv__ch" style="--ch:' + ch.color + '" title="' + U.esc(ch.label) + '">' +
        ic(ch.icon || 'bubble') + '</span>' +
      '</span>';
  }

  function lastLine(conv) {
    var m = sel.lastMessage(conv);
    if (!m) return 'Nenhuma mensagem ainda.';
    var who = m.author === 'ai' ? 'IA: ' : m.author === 'operator' ? 'Você: ' : m.author === 'system' ? '' : '';
    var body = m.kind === 'file' ? 'Arquivo: ' + (m.meta ? m.meta.fileName : 'anexo')
      : m.kind === 'audio' ? 'Áudio (' + U.fmtClock(m.meta.duration) + ')'
      : m.text;
    return (who ? '<b>' + U.esc(who) + '</b>' : '') + U.esc(body);
  }

  /* ==================================================================== */
  /* ==================================================================== */
  function renderTopbar() {
    var m = sel.metrics();
    var paused = S.operatorPaused;

    dom.ident.innerHTML =
      (SO.avatar
        ? '<span class="ident__av ident__av--img' + (paused ? ' ident__av--paused' : '') +
          '"><img src="' + SO.avatar + '" alt=""></span>'
        : '<span class="ident__av' + (paused ? ' ident__av--paused' : '') + '">' +
          U.esc(S.currentUser.initials) + '</span>') +
      '<span class="ident__txt">' +
        '<strong>' + U.esc(S.currentUser.name) + '</strong>' +
        (paused
          ? '<span class="ident__role ident__role--paused">' + ic('pause', 'icon--sm') +
            'Em pausa desde ' + U.fmtTime(S.pausedSince) + '</span>'
          : '<span class="ident__role">' + U.esc(S.currentUser.role) + '</span>') +
      '</span>' +
      '<button type="button" class="btn btn--sm ident__sim' + (S.simRunning ? '' : ' btn--success') +
        '" data-act="sim-toggle" title="' +
        (S.simRunning ? 'Congela os eventos automáticos da demonstração' : 'Retoma os eventos automáticos') + '">' +
        ic(S.simRunning ? 'pause' : 'play', 'icon--sm') +
        (S.simRunning ? 'Pausar simulação' : 'Retomar simulação') + '</button>';

    var unread = S.notifications.length;
    dom.bellBtn.innerHTML = ic('bell') + (unread ? '<span class="dot"></span>' : '');
    dom.bellBtn.setAttribute('aria-label', 'Notificações (' + unread + ')');

    if (!dom.bellPanel.hidden) renderBell();
    return m;
  }

  /* barra vertical à esquerda: layout, tema e sessão do operador */
  var LAYOUTS = [
    { n: 1, label: '1 tela',  hint: 'Uma conversa ocupando toda a área' },
    { n: 2, label: '2 telas', hint: 'Duas conversas lado a lado' },
    { n: 3, label: '3 telas', hint: 'Três conversas lado a lado' },
    { n: 4, label: '4 telas', hint: 'Quatro conversas em quadrantes' }
  ];

  function layoutGlyph(n) {
    var cells = {
      1: '<rect x="3" y="4.5" width="18" height="15" rx="1.6"></rect>',
      2: '<rect x="3" y="4.5" width="8.2" height="15" rx="1.4"></rect>' +
         '<rect x="12.8" y="4.5" width="8.2" height="15" rx="1.4"></rect>',
      3: '<rect x="2.5" y="4.5" width="5.6" height="15" rx="1.3"></rect>' +
         '<rect x="9.2" y="4.5" width="5.6" height="15" rx="1.3"></rect>' +
         '<rect x="15.9" y="4.5" width="5.6" height="15" rx="1.3"></rect>',
      4: '<rect x="3" y="4.5" width="8.2" height="6.8" rx="1.3"></rect>' +
         '<rect x="12.8" y="4.5" width="8.2" height="6.8" rx="1.3"></rect>' +
         '<rect x="3" y="12.7" width="8.2" height="6.8" rx="1.3"></rect>' +
         '<rect x="12.8" y="12.7" width="8.2" height="6.8" rx="1.3"></rect>'
    };
    return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">' + cells[n] + '</svg>';
  }

  function renderRail() {
    var paused = S.operatorPaused;
    var max = S.maxOpenConversations;

    dom.rail.innerHTML =
      '<span class="rail__sep"></span>' +
      '<span class="rail__layout">' +
      '<button type="button" class="rail__btn' + (S.layoutOpen ? ' rail__btn--on' : '') +
        '" data-act="layout-menu"' +
        ' title="Layout: ' + max + (max > 1 ? ' telas' : ' tela') +
        '" aria-label="Alterar layout de visualização" aria-expanded="' + !!S.layoutOpen + '">' +
        layoutGlyph(max) + '</button>' +

      '<div class="popover popover--layout" ' + (S.layoutOpen ? '' : 'hidden') + '>' +
        '<span class="label">Telas simultâneas</span>' +
        LAYOUTS.map(function (l) {
          return '<button type="button" class="layout-item' + (l.n === max ? ' layout-item--on' : '') +
            '" data-act="layout-set" data-n="' + l.n + '">' +
            layoutGlyph(l.n) +
            '<span class="layout-item__txt"><strong>' + l.label + '</strong>' +
            '<span>' + l.hint + '</span></span>' +
            (l.n === max ? ic('check', 'icon--sm') : '') +
            '</button>';
        }).join('') +
      '</div>' +
      '</span>' +

      '<span class="rail__smart">' +
      '<button type="button" class="rail__btn' + (S.smartOpen ? ' rail__btn--on' : '') +
        '" data-act="smart-config" title="Envio inteligente de mensagens"' +
        ' aria-label="Configurar envio inteligente" aria-expanded="' + !!S.smartOpen + '">' +
        ic('bubbles') +
        (S.smartSend.enabled ? '' : '<span class="rail__off"></span>') + '</button>' +
      smartPanel() +
      '</span>' +
      '<button type="button" class="rail__btn" data-act="kb-list" title="Base de conhecimento da IA"' +
        ' aria-label="Base de conhecimento">' + ic('book') +
        (SO.knowledge.count() ? '<span class="rail__badge">' + SO.knowledge.count() + '</span>' : '') +
        '</button>' +
      '<button type="button" class="rail__btn" data-act="theme-toggle" title="' +
        (S.theme === 'dark' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro') +
        '" aria-label="Alternar tema">' + ic(S.theme === 'dark' ? 'sun' : 'moon') + '</button>' +
      '<button type="button" class="rail__btn ' + (paused ? 'rail__btn--warn' : '') +
        '" data-act="op-pause" title="' + (paused ? 'Sair da pausa' : 'Entrar em pausa') +
        '" aria-label="' + (paused ? 'Sair da pausa' : 'Entrar em pausa') + '">' +
        ic(paused ? 'play' : 'pause') + '</button>' +
      '<button type="button" class="rail__btn rail__btn--danger" data-act="op-logout"' +
        ' title="Sair do Super Operador" aria-label="Sair do Super Operador">' +
        ic('logout') + '</button>';
  }

  function renderMetrics(m) {
    var tiles = [
      { k: 'Monitorados', v: m.total, f: 'todos' },
      { k: 'IA ativa', v: m.iaAtiva, f: 'ia_ativa' },
      { k: 'IA pausada', v: m.iaPausada, f: 'ia_pausada' },
      { k: 'Operador assumiu', v: m.operador, f: 'operador' },
      { k: 'Insatisfeitos', v: m.insatisfeitos, f: 'insatisfeitos' },
      { k: 'Finalizados', v: S.finished, f: null }
    ];

    var html = tiles.map(function (t) {
      if (!t.f) {
        return '<div class="metric metric--static">' +
          '<span class="metric__k">' + U.esc(t.k) + '</span>' +
          '<span class="metric__v">' + t.v + '</span></div>';
      }
      return '<button type="button" class="metric" data-metric="' + t.f + '" aria-pressed="' +
        (S.filter === t.f) + '">' +
        '<span class="metric__k">' + U.esc(t.k) + '</span>' +
        '<span class="metric__v">' + t.v + '</span></button>';
    }).join('');

    html += '<button type="button" class="metric metric--alert" data-metric="alertas"' +
      ' aria-pressed="' + (S.filter === 'alertas') + '">' +
      '<span class="metric__k">' + (m.alertas ? '<span class="metric__tick"></span>' : '') + 'Com alerta</span>' +
      '<span class="metric__v">' + m.alertas + '</span></button>';

    html += '<div class="metric metric--static">' +
      '<span class="metric__k">Em visualização</span>' +
      '<span class="metric__v">' + S.openIds.length + '<span style="font-size:12px;color:var(--text-faint)">/' +
      S.maxOpenConversations + '</span></span></div>';

    dom.metrics.innerHTML = html;
  }

  function renderBell() {
    var items = S.notifications;
    var html = '<div class="bell-head"><span class="label">Eventos recentes</span>' +
      (items.length ? '<button type="button" class="btn btn--ghost btn--sm" data-act="clear-notifs">Limpar</button>' : '') +
      '</div>';

    if (!items.length) {
      html += '<div class="bell-empty">Nenhum evento novo. Tudo sob controle.</div>';
    } else {
      html += items.map(function (n) {
        var icon = n.kind === 'alert' ? 'alert' : n.kind === 'ok' ? 'check' : 'info';
        return '<div class="notif notif--' + n.kind + '">' +
          '<span class="notif__ic">' + ic(icon, 'icon--sm') + '</span>' +
          '<span class="notif__b"><span class="notif__t">' + U.esc(n.title) +
          (n.who ? ' · ' + U.esc(n.who) : '') + '</span>' +
          '<span class="notif__m">' + U.fmtTime(n.at) + '</span></span></div>';
      }).join('');
    }
    dom.bellPanel.innerHTML = html;
  }

  /* ==================================================================== */
  /* ==================================================================== */
  function renderFilters() {
    dom.filters.innerHTML = sel.filters.map(function (f) {
      return '<button type="button" class="chip" data-filter="' + f.key + '" aria-pressed="' +
        (S.filter === f.key) + '">' + U.esc(f.label) +
        '<span class="chip__n">' + sel.countFilter(f.key) + '</span></button>';
    }).join('');
  }

  function convItem(conv) {
    var open = sel.isOpen(conv.id);
    var alert = conv.alert.active;
    var blink = sel.alertBlinks(conv);
    var sla = slaState(conv);
    var m = sel.lastMessage(conv);

    /* com alerta ativo, a badge vermelha já comunica o sentimento */
    /* o sentimento aparece sempre — inclusive com alerta ativo, porque são eixos
       diferentes (problema do atendimento x reação do cliente) */
    var tags = alertTag(conv) + statusTag(conv) + sentimentTag(conv) + priorityTag(conv);

    return '<div class="conv" role="button" tabindex="0" data-id="' + conv.id + '"' +
      ' data-open="' + open + '" data-alert="' + blink + '"' +
      ' aria-label="Atendimento de ' + U.esc(conv.name) + '">' +
      avatar(conv, 'conv__av', slaAvClass(sla), slaAvStyle(sla)) +
      '<span class="conv__body">' +
        '<span class="conv__row">' +
          '<span class="conv__name">' + U.esc(conv.name) + '</span>' +
          (open ? '<span class="conv__slot" title="Aberto na tela ' + sel.slotOf(conv.id) + '">' +
            ic('monitor', 'icon--sm') + sel.slotOf(conv.id) + '</span>' : '') +
          (conv.unread ? '<span class="conv__unread">' + conv.unread + '</span>' : '') +
          '<span class="conv__time">' + (m ? U.fmtTime(m.at) : '--:--') + '</span>' +
        '</span>' +
        '<span class="conv__proto">#' + U.esc(conv.protocol) + ' · ' + U.esc(sel.channelOf(conv).label) + '</span>' +
        '<span class="conv__last">' + lastLine(conv) + '</span>' +
        '<span class="conv__tags">' + tags + '</span>' +
      '</span>' +
      '</div>';
  }

  function renderConversationList() {
    var list = sel.visible();
    var openList = list.filter(function (c) { return sel.isOpen(c.id); });
    var others = list.filter(function (c) { return !sel.isOpen(c.id); });

    dom.listCount.textContent = list.length + ' de ' + S.conversations.length;

    var html = '';

    html += '<div class="group group--open"><span class="group__t">Atendimentos abertos</span>' +
      '<span class="group__n">' + S.openIds.length + '/' + S.maxOpenConversations + '</span></div>';
    if (S.limitHintUntil > Date.now()) {
      html += '<p class="group-limit">' + ic('info', 'icon--sm') +
        'Limite de ' + S.maxOpenConversations + (S.maxOpenConversations > 1 ? ' telas' : ' tela') +
        ' atingido. Feche um atendimento ou aumente o layout na barra à esquerda.</p>';
      setTimeout(function () { if (S.limitHintUntil <= Date.now()) render(); }, 6200);
    }

    html += openList.length
      ? openList.map(convItem).join('')
      : '<p class="group-empty">' + (S.openIds.length
          ? 'Os atendimentos abertos não correspondem ao filtro atual.'
          : 'Nenhum atendimento aberto. Clique em um atendimento abaixo para acompanhar.') + '</p>';

    html += '<div class="group"><span class="group__t">Outros atendimentos</span>' +
      '<span class="group__n">' + others.length + '</span></div>';
    html += others.length
      ? others.map(convItem).join('')
      : '<p class="group-empty">Nenhum atendimento encontrado para a pesquisa/filtro.</p>';

    dom.convList.innerHTML = html;
  }

  /* ==================================================================== */
  /* ==================================================================== */
  function emptyState() {
    return '<div class="empty">' +
      '<span class="empty__ic">' + ic('grid') + '</span>' +
      '<h2>Nenhum atendimento em visualização</h2>' +
      '<p>Selecione um atendimento na lista à esquerda para acompanhar em tempo real a conversa entre a IA e o cliente. É possível monitorar até 4 atendimentos ao mesmo tempo.</p>' +
      '<span class="empty__hint">' + ic('alert', 'icon--sm') +
      ' A tag vermelha na lista mostra quais atendimentos precisam da sua intervenção.</span>' +
      '</div>';

          '<span class="card__ctrl" data-role="ctrl"></span>' +
          '<button type="button" class="icon-btn icon-btn--sm" data-act="summary" data-id="' + conv.id +

            ic('sparkle', 'icon--sm') + '</button>' +
          '<button type="button" class="icon-btn icon-btn--sm" data-act="menu" data-id="' + conv.id +
            '" title="Mais ações" aria-label="Mais ações do atendimento">' + ic('dots', 'icon--sm') + '</button>' +
          '<button type="button" class="icon-btn icon-btn--sm icon-btn--danger" data-act="close" data-id="' + conv.id +
            '" title="Fechar visualização" aria-label="Fechar atendimento de ' + U.esc(conv.name) + '">' +
            ic('close', 'icon--sm') + '</button>' +
          '<div class="popover popover--menu" data-role="menu" hidden></div>' +
        '</div>' +
        '<div class="card__alertbar" hidden></div>' +
        '<div class="card__sub">' +
          '<span class="card__proto mono">#' + U.esc(conv.protocol) + '</span>' +
          '<i class="sep"></i><span class="card__chan">' + U.esc(sel.channelOf(conv).label) + '</span>' +
          '<span class="card__tags"></span>' +
        '</div>' +
      '</header>' +
      '<div class="msgs" data-role="msgs"></div>' +
      '<div class="kb-bar" data-role="kb-bar" hidden></div>' +
      '<footer class="locked" data-role="locked" hidden></footer>' +
      '<footer class="composer" data-role="composer" hidden>' +
        '<div class="composer__meta">' +
          '<div class="composer__note"></div>' +
          '<div class="composer__actions">' +
            '<button type="button" class="btn btn--sm" data-act="tabular" data-id="' + conv.id + '">' +
              ic('tag', 'icon--sm') + 'Tabular</button>' +
            '<button type="button" class="btn btn--sm" data-act="transferir" data-id="' + conv.id + '">' +

        '<div class="rec" hidden>' +
          '<span class="rec__dot"></span>' +

          '<span class="rec__t mono">00:00</span>' +
          '<button type="button" class="btn btn--sm" data-act="rec-cancel" data-id="' + conv.id + '">Cancelar</button>' +
          '<button type="button" class="btn btn--sm btn--primary" data-act="rec-send" data-id="' + conv.id + '">Enviar áudio</button>' +
        '</div>' +
        '<div class="composer__box">' +
          '<textarea rows="1" data-role="input" data-id="' + conv.id +
            '" placeholder="Escreva sua mensagem para o cliente"></textarea>' +
          '<span class="composer__tools">' +
            '<button type="button" class="icon-btn icon-btn--sm" data-act="emoji" data-id="' + conv.id +
              '" title="Emojis" aria-label="Inserir emoji">' + ic('emoji', 'icon--sm') + '</button>' +
            '<button type="button" class="icon-btn icon-btn--sm" data-act="file" data-id="' + conv.id +
              '" title="Anexar arquivo" aria-label="Anexar arquivo">' + ic('clip', 'icon--sm') + '</button>' +
            '<button type="button" class="icon-btn icon-btn--sm" data-act="mic" data-id="' + conv.id +
              '" title="Gravar áudio" aria-label="Gravar áudio">' + ic('mic', 'icon--sm') + '</button>' +
            '<button type="button" class="send-btn" data-act="send" data-id="' + conv.id +

              '" data-emoji="' + e + '">' + e + '</button>';

  function bubbleBody(m) {
    if (m.kind === 'template') {
      return '<span class="tpl-tag">' + ic('bubbles', 'icon--sm') + 'MODELO · ' +
        U.esc(m.meta && m.meta.template ? m.meta.template : 'HSM') + '</span>' +
        '<span class="bubble__txt">' + U.esc(m.text) + '</span>';
    }
    if (m.kind === 'file') {
      return '<span class="attach"><span class="attach__ic">' + ic('file', 'icon--sm') + '</span>' +
        '<span><span class="attach__n">' + U.esc(m.meta.fileName) + '</span><br>' +
        '<span class="attach__s">' + U.esc(m.meta.size) + ' · anexo enviado</span></span></span>' +
        (m.text && m.text !== m.meta.fileName ? '<span class="bubble__txt">' + U.esc(m.text) + '</span>' : '');
    }
    if (m.kind === 'audio') {
      var bars = '';
      for (var i = 0; i < 22; i++) {
        bars += '<i style="--h:' + (4 + ((i * 7) % 14)) + 'px"></i>';
      }
      return '<span class="audio">' + ic('mic', 'icon--sm') +
        '<span class="audio__wave">' + bars + '</span>' +
        '<span class="audio__t">' + U.fmtClock(m.meta.duration) + '</span></span>';
    }
    return (m.meta && m.meta.grouped
      ? '<span class="grouped-tag">' + ic('sparkle', 'icon--sm') + 'envio inteligente · ' +
        m.meta.grouped + ' mensagens</span>'
      : '') +
      (m.meta && m.meta.fromKnowledge
      ? '<span class="kb-src">' + ic('sparkle', 'icon--sm') + 'base de conhecimento · ' +
        U.esc(m.meta.fromKnowledge) + '</span>'
      : '') +
      '<span class="bubble__txt">' + U.esc(m.text) + '</span>';
  }

  /* Ação por mensagem do operador: selecionar respostas para ensinar a IA.
     Antes da primeira seleção, cada mensagem elegível mostra o botão "Ensinar
     a IA" (o convite inicial). Assim que uma é marcada, todas as outras
     mudam para uma caixa de seleção na frente da mensagem — deixa claro que
     dá para marcar mais de uma antes de confirmar. */
  function kbSelection(conv) {
    if (!conv.ui.kbSelection) conv.ui.kbSelection = [];
    return conv.ui.kbSelection;
  }

  function kbModeActive(conv) { return kbSelection(conv).length > 0; }

  /* conteúdo que fica DEPOIS da bolha quando não há seleção em andamento */
  function kbInvite(conv, m) {
    if (m.knowledge) {
      return '<span class="kb-slot kb-flag">' + ic('sparkle', 'icon--sm') +
        'Na base de conhecimento</span>';
    }
    return '<button type="button" class="kb-slot kb-btn" data-act="kb-pick" data-id="' +
      conv.id + '" data-msg="' + m.id + '" title="Selecionar esta resposta para ensinar a IA">' +
      ic('sparkle', 'icon--sm') + 'Ensinar a IA</button>';
  }

  /* checkbox que fica NA FRENTE da bolha quando já existe alguma seleção */
  function kbCheckbox(conv, m) {
    if (m.knowledge) {
      return '<span class="kb-check kb-check--done" title="Já está na base de conhecimento">' +
        '<span class="kb-check__box">' + ic('check', 'icon--sm') + '</span></span>';
    }
    var on = kbSelection(conv).indexOf(m.id) !== -1;
    return '<label class="kb-check' + (on ? ' kb-check--on' : '') +
      '" title="Selecionar esta resposta para ensinar a IA">' +
      '<input type="checkbox" data-act="kb-pick" data-id="' + conv.id + '" data-msg="' + m.id +
      '"' + (on ? ' checked' : '') + '>' +
      '<span class="kb-check__box">' + ic('check', 'icon--sm') + '</span></label>';
  }

  /* redesenha as mensagens do operador (muda de layout ao entrar/sair do
     modo de seleção) e a barra de confirmação do card */
  function refreshKbUi(convId) {
    var conv = sel.byId(convId);
    var card = cards[convId];
    if (!conv || !card) return;

    var prevAuthor = '';
    conv.messages.forEach(function (m) {
      var contFlag = m.author !== 'system' && m.author === prevAuthor;
      prevAuthor = m.author;
      if (m.author !== 'operator' || m.kind !== 'text') return;
      var row = card.querySelector('[data-msg-id="' + m.id + '"]');
      if (row) row.outerHTML = messageHTML(conv, m, contFlag);
    });

    var bar = card.querySelector('[data-role="kb-bar"]');
    if (!bar) return;
    var n = kbSelection(conv).length;
    bar.hidden = !n;
    if (n) {
      bar.innerHTML = ic('sparkle', 'icon--sm') +
        '<span class="kb-bar__t">' + n + (n > 1 ? ' respostas selecionadas' : ' resposta selecionada') +
        '</span>' +
        '<button type="button" class="btn btn--sm" data-act="kb-clear" data-id="' + conv.id +
        '">Cancelar</button>' +
        '<button type="button" class="btn btn--sm btn--primary" data-act="kb-open" data-id="' + conv.id +
        '">' + ic('sparkle', 'icon--sm') + 'Ensinar a IA</button>';
    }
  }

  function messageHTML(conv, m, cont) {
    if (m.author === 'system') {
      var kind = m.meta && m.meta.kind ? m.meta.kind : 'info';
      var icon = kind === 'alert' ? 'alert' : kind === 'ok' ? 'check' : 'info';
      return '<div class="msg msg--system" data-kind="' + kind + '">' +
        '<span class="sys">' + ic(icon) + U.esc(m.text) +
        ' <span class="mono" style="opacity:.6">· ' + U.fmtTime(m.at) + '</span></span></div>';
    }

    var who = m.author === 'ai' ? 'IA Voll'
      : m.author === 'operator' ? S.currentUser.name.split(' ')[0] + ' · Operador'
      : conv.name;
    var icon = m.author === 'ai' ? 'sparkle' : m.author === 'operator' ? 'user' : 'bubble';

    var pickable = m.author === 'operator' && m.kind === 'text';
    var checkboxMode = pickable && kbModeActive(conv);

    var col = '<div class="msg__col">' +
      '<div class="bubble">' +
        (cont ? '' : '<span class="bubble__who">' + ic(icon) + U.esc(who) + '</span>') +
        bubbleBody(m) +
        '<span class="bubble__time">' + U.fmtTime(m.at) + '</span>' +
      '</div>' +
      (pickable && !checkboxMode ? kbInvite(conv, m) : '') +
    '</div>';

    return '<div class="msg msg--' + m.author + (cont ? ' msg--cont' : '') +
      (checkboxMode ? ' msg--pickable' : '') +
      '" data-msg-id="' + m.id + '">' +
      (checkboxMode ? kbCheckbox(conv, m) : '') + col +
      '</div>';
  }

  function renderMessages(conv, el) {
    var box = el.querySelector('[data-role="msgs"]');

    /* o loop da simulação descarta mensagens antigas: reconstrói do zero */
    if (box._count && conv.messages.length < box._count) {
      box.innerHTML = '';
      box._rendered = {};
      box._lastDay = '';
      box._prevAuthor = '';
      box._painted = false;
    }
    var first = !box._painted;
    var nearBottom = first || (box.scrollHeight - box.scrollTop - box.clientHeight < 90);
    var added = false;

    conv.messages.forEach(function (m) {
      if (box._rendered[m.id]) return;
      var day = U.fmtDay(m.at);
      if (day !== box._lastDay) {
        box.insertAdjacentHTML('beforeend', '<div class="day"><span>' + U.esc(day) + '</span></div>');
        box._lastDay = day;
      }
      /* mensagens seguidas do mesmo autor não repetem o rótulo */
      var cont = m.author !== 'system' && m.author === box._prevAuthor;
      box.insertAdjacentHTML('beforeend', messageHTML(conv, m, cont));
      box._prevAuthor = m.author;
      box._rendered[m.id] = true;
      added = true;
    });

    /* indicador de digitação da IA sempre no fim */
    var typing = box.querySelector('.typing');
    if (conv.typing && !typing) {
      box.insertAdjacentHTML('beforeend',
        '<div class="typing"><span class="typing__label">' + ic('sparkle', 'icon--sm') +
        ' IA digitando</span><span class="typing__dots"><i></i><i></i><i></i></span></div>');
      added = true;
    } else if (!conv.typing && typing) {
      typing.remove();
    } else if (conv.typing && typing && added) {
      box.appendChild(typing);
    }

    box._count = conv.messages.length;
    /* bloco do envio inteligente, sempre por último */
    if (renderSmart(conv, box)) added = true;

    if (added) box._painted = true;
    if (added && nearBottom) box.scrollTop = box.scrollHeight;
  }

  /* mantém os anéis de SLA em dia e dispara o estouro.
     O tempo aparece só no anel do ícone do cliente — sem contador ao lado. */
  function tickSla() {
    if (!S.simRunning) return;

    S.conversations.forEach(function (conv) {
      var st = slaState(conv);
      if (st.running && st.stage === 'red' && !conv.alert.active) {
        A.triggerAlert(conv.id, 'sla');
      }
    });

    var avs = document.querySelectorAll('[data-sla-av]');
    for (var j = 0; j < avs.length; j++) {
      var c = sel.byId(avs[j].getAttribute('data-sla-av'));
      if (!c) continue;
      var s = slaState(c);
      var base = avs[j].classList.contains('card__av') ? 'card__av' : 'conv__av';
      avs[j].className = base + (s.show ? ' ' + slaAvClass(s) : '');
      avs[j].style.setProperty('--sla-pct', s.pct);
      avs[j].setAttribute('title', s.show
        ? (s.running ? 'Cliente aguardando resposta há ' + U.fmtClock(s.secs)
                     : 'SLA estourado · respondido em ' + U.fmtClock(s.secs))
        : '');
    }
  }

  function updateCard(conv) {
    var el = cards[conv.id];
    if (!el) return;

    /* só os alertas do tipo 'blink' piscam a borda; SLA usa o contador */
    el.dataset.alert = String(sel.alertBlinks(conv));

    /* SLA: só o anel no ícone do cliente, nos três estágios */
    var sla = slaState(conv);
    var av = el.querySelector('.card__av');
    av.className = 'card__av' + (sla.show ? ' ' + slaAvClass(sla) : '');
    av.style.setProperty('--sla-pct', sla.pct);

    /* tags */
    /* no card cabe o quadro completo: causa do alerta + status + sentimento */
    el.querySelector('.card__tags').innerHTML =
      alertTag(conv) + statusTag(conv) + sentimentTag(conv) + priorityTag(conv) +
      (conv.transfer ? tag('tag--transf', 'Fila: ' + conv.transfer.queue, 'transfer') : '');

    /* barra de alerta: só o motivo. Resolver fica no menu ⋯, fora do caminho. */
    var bar = el.querySelector('.card__alertbar');
    if (conv.alert.active) {
      bar.hidden = false;
      bar.innerHTML = ic('alert') + '<span>' + U.esc(conv.alert.reason) + '</span>';
    } else {
      bar.hidden = true;
      bar.innerHTML = '';
    }

    /* controles primários no header (só o essencial) */
    var ctrl = '';
    if (conv.owner === 'operator') {
      ctrl += '<button type="button" class="btn btn--sm btn--info" data-act="return" data-id="' + conv.id + '"' +
        ' title="Devolver o atendimento para a IA">' + ic('sparkle', 'icon--sm') + 'Devolver</button>';
    } else {
      if (conv.aiState === 'active') {
        ctrl += '<button type="button" class="btn btn--sm btn--warning" data-act="pause" data-id="' +
          conv.id + '" title="Pausar a IA deste atendimento">Pausar IA' + ic('pause', 'icon--sm') + '</button>';
      } else {
        ctrl += '<button type="button" class="btn btn--sm btn--success" data-act="start" data-id="' +
          conv.id + '" title="Reativar a IA deste atendimento">Iniciar IA' + ic('play', 'icon--sm') + '</button>';
      }
      ctrl += '<button type="button" class="btn btn--sm" data-act="takeover" data-id="' + conv.id + '"' +
        ' title="Assumir o atendimento e responder">' + ic('hand', 'icon--sm') + 'Assumir</button>';
    }
    el.querySelector('[data-role="ctrl"]').innerHTML = ctrl;

    /* menu de ações secundárias */
    var menu = el.querySelector('[data-role="menu"]');
    var items = '';
    items += menuItem(conv.id, 'summary', 'sparkle', 'Resumir atendimento');
    if (conv.alert.active) {
      items += menuItem(conv.id, 'resolve', 'check', 'Resolver alerta', 'danger');
    }
    if (conv.owner === 'operator') {
      items += menuItem(conv.id, 'return', 'sparkle', 'Devolver para IA');
    } else {
      items += menuItem(conv.id, 'takeover', 'hand', 'Assumir atendimento');
      items += conv.aiState === 'active'
        ? menuItem(conv.id, 'pause', 'pause', 'Pausar IA')
        : menuItem(conv.id, 'start', 'play', 'Iniciar IA');
    }
    if (conv.requiresTemplate) items += menuItem(conv.id, 'hsm-open', 'bubbles', 'Enviar modelo de mensagem');
    items += menuItem(conv.id, 'tabular', 'tag', 'Tabular atendimento');
    items += menuItem(conv.id, 'transferir', 'transfer', 'Transferir atendimento');
    items += menuItem(conv.id, 'details', 'user', 'Dados do contato');
    menu.innerHTML = items;
    menu.hidden = !conv.ui.menuOpen;

    /* rodapé: barra bloqueada enquanto o operador não assumir */
    var locked = el.querySelector('[data-role="locked"]');
    var live = el.querySelector('[data-role="composer"]');
    /* canal oficial sem modelo enviado bloqueia o envio livre, mesmo assumido */
    var blockedByChannel = conv.requiresTemplate && (!conv.templateSent || conv.awaitingFirstReply);
    var assumed = conv.owner === 'operator' && !blockedByChannel;
    locked.hidden = assumed;
    live.hidden = !assumed;

    if (!assumed) {
      var needsTpl = conv.requiresTemplate && !conv.templateSent;
      var waitingReply = conv.awaitingFirstReply;
      var lockedTxt = needsTpl
        ? 'Canal oficial — a conversa começa com um modelo de mensagem (HSM)'
        : waitingReply
          ? 'Modelo enviado · aguardando a primeira resposta do cliente'
          : conv.tabulation
            ? 'Atendimento tabulado por ' + conv.tabulation.author
            : conv.aiState === 'active'
              ? 'IA no comando — o envio de mensagens está bloqueado'
              : 'IA pausada — o cliente está sem resposta automática';

      locked.innerHTML = ic('lock', 'icon--sm') +
        '<span class="locked__t">' + U.esc(lockedTxt) + '</span>' +
        (conv.requiresTemplate
          ? '<button type="button" class="btn btn--sm ' + (needsTpl ? 'btn--primary' : '') +
            '" data-act="hsm-open" data-id="' + conv.id + '">' +
            ic('bubbles', 'icon--sm') + 'Enviar modelo de mensagem</button>'
          : '') +
        (needsTpl || waitingReply ? '' :
          '<button type="button" class="btn btn--sm btn--primary" data-act="takeover" data-id="' + conv.id + '">' +
          ic('hand', 'icon--sm') + 'Assumir para responder</button>');
    } else {
      var note = el.querySelector('.composer__note');
      note.innerHTML = conv.tabulation
        ? ic('tag') + 'Tabulado · ' + U.esc(conv.tabulation.category) + ' › ' + U.esc(conv.tabulation.result)
        : ic('user') + 'Você está conduzindo este atendimento.';
    }

    /* anexo pendente */
    var fileBox = el.querySelector('.composer__file');
    if (conv.ui.attachment) {
      fileBox.hidden = false;
      fileBox.innerHTML = ic('file', 'icon--sm') +
        '<span class="name">' + U.esc(conv.ui.attachment.name) + '</span>' +
        '<span class="size">' + U.esc(conv.ui.attachment.size) + '</span>' +
        '<button type="button" class="icon-btn icon-btn--sm" data-act="unattach" data-id="' + conv.id +
        '" aria-label="Remover anexo">' + ic('close', 'icon--sm') + '</button>';
    } else {
      fileBox.hidden = true;
      fileBox.innerHTML = '';
    }

    /* gravação */
    var composer = el.querySelector('.composer');
    var rec = el.querySelector('.rec');
    if (conv.ui.recording) {
      composer.dataset.rec = 'true';
      rec.hidden = false;
      rec.querySelector('.rec__t').textContent = U.fmtClock(conv.ui.recording.seconds);
    } else {
      composer.removeAttribute('data-rec');
      rec.hidden = true;
    }

    /* emoji */
    el.querySelector('.popover--emoji').hidden = !conv.ui.emojiOpen;

    /* rascunho + botão enviar */
    var input = el.querySelector('[data-role="input"]');
    if (document.activeElement !== input && input.value !== conv.ui.draft) {
      input.value = conv.ui.draft;
      autoGrow(input);
    }
    el.querySelector('.send-btn').disabled = !conv.ui.draft.trim() && !conv.ui.attachment;

    renderMessages(conv, el);
    refreshKbUi(conv.id);
  }

  function scrollAllToBottom() {
    Object.keys(cards).forEach(function (id) {
      var box = cards[id].querySelector('[data-role="msgs"]');
      if (box) box.scrollTop = box.scrollHeight;
    });
  }

  var prevCount = 0;

  function renderWorkspace() {
    var ids = S.openIds;

    if (!ids.length) {
      dom.workspace.innerHTML = emptyState();
      cards = {};
      prevCount = 0;
      return;
    }

    /* mudar a quantidade de cards redimensiona a área da conversa:
       reancora todos no fim para não “perder” a última mensagem */
    var resized = prevCount !== ids.length;
    prevCount = ids.length;

    var grid = dom.workspace.querySelector('.grid');
    if (!grid) {
      dom.workspace.innerHTML = '<div class="grid"></div>';
      grid = dom.workspace.querySelector('.grid');
      cards = {};
    }
    grid.dataset.count = String(ids.length);

    Object.keys(cards).forEach(function (id) {
      if (ids.indexOf(id) === -1) {
        cards[id].remove();
        delete cards[id];
      }
    });

    ids.forEach(function (id, i) {
      var conv = sel.byId(id);
      if (!conv) return;
      if (!cards[id]) cards[id] = buildCard(conv);
      /* só move o nó se a ordem estiver diferente (evita resetar scroll) */
      if (grid.children[i] !== cards[id]) {
        grid.insertBefore(cards[id], grid.children[i] || null);
      }
      updateCard(conv);
    });

    if (resized) scrollAllToBottom();
  }

  function renderHsm() {
    var modal = dom.modalRoot.querySelector('.modal');
    if (!modal) return;
    var nameEl = modal.querySelector('[data-role="hsm-name"]');
    var box = modal.querySelector('[data-role="hsm-fields"]');
    var preview = modal.querySelector('[data-role="hsm-body"]');
    if (!nameEl || !box || !preview) return;

    var tpl = hsmByName(nameEl.value);
    if (!tpl) {
      box.innerHTML = '';
      box.removeAttribute('data-tpl');
      preview.textContent = 'Selecione um modelo para ver a mensagem.';
      return;

    if (box.getAttribute('data-tpl') !== tpl.name) {
      box.setAttribute('data-tpl', tpl.name);
      box.innerHTML = tpl.fields.length
        ? '<span class="label">Campo(s)</span>' + tpl.fields.map(function (f, i) {
            return '<label class="field field--row"><span>{{' + (i + 1) + '}} ' + U.esc(f) + '</span>' +
              '<input class="input" data-role="hsm-field" placeholder="' + U.esc(f) + '"></label>';
          }).join('')
        : '<p class="hint">Este modelo não tem campos para preencher.</p>';
    }

    preview.textContent = A.renderTemplate(tpl, hsmFieldValues(modal).map(function (v, i) {
      return v || '{{' + (i + 1) + '}}';
    }));
  }

  /* ==================================================================== */

  function smartSecondsLeft(conv) {
    if (!conv.smart) return 0;
    return Math.max(0, Math.ceil((conv.smart.dueAt - Date.now()) / 1000));
  }

  function smartHTML(conv) {
    var left = smartSecondsLeft(conv);
    var urgent = left <= 2;

    if (conv.smart.editing) {
      return '<div class="smart smart--edit" data-role="smart">' +
        '<div class="smart__head">' + ic('sparkle', 'icon--sm') +
          '<span class="smart__tag">Editando antes de enviar</span></div>' +
        '<div class="smart__edit">' +
          '<label class="hint">Uma mensagem por linha</label>' +
          '<textarea class="textarea" data-role="smart-text" rows="4">' +
            U.esc(conv.smart.parts.join('\n')) + '</textarea>' +
        '</div>' +
        '<div class="smart__actions">' +
          '<button type="button" class="btn btn--sm" data-act="smart-cancel-edit" data-id="' + conv.id +
            '">Voltar</button>' +
          '<button type="button" class="btn btn--sm btn--primary" data-act="smart-save" data-id="' + conv.id +
            '">' + ic('check', 'icon--sm') + 'Salvar</button>' +
        '</div>' +
      '</div>';
    }

    return '<div class="smart" data-role="smart">' +
      '<div class="smart__head">' + ic('sparkle', 'icon--sm') +
        '<span class="smart__tag">Envio inteligente · ainda não enviada</span>' +
        '<span class="smart__timer' + (urgent ? ' smart__timer--urgent' : '') + '">' +
          ic('clock', 'icon--sm') + '<span data-role="smart-t">' + left + 's</span></span>' +
      '</div>' +
      '<div class="smart__parts">' +
        conv.smart.parts.map(function (t, i) {
          return '<p class="smart__part"><span class="smart__n">' + (i + 1) + '</span>' +
            U.esc(t) + '</p>';
        }).join('') +
      '</div>' +
      '<div class="smart__actions">' +
        '<button type="button" class="btn btn--sm" data-act="smart-edit" data-id="' + conv.id +
          '">Editar</button>' +
        '<button type="button" class="btn btn--sm btn--danger" data-act="smart-cancel" data-id="' + conv.id +
          '">Cancelar</button>' +
        '<button type="button" class="btn btn--sm btn--primary" data-act="smart-now" data-id="' + conv.id +
          '">' + ic('send', 'icon--sm') + 'Enviar agora</button>' +
      '</div>' +
    '</div>';
  }

  /* o bloco fica sempre no fim da conversa, como a última coisa a acontecer */
  function renderSmart(conv, box) {
    var node = box.querySelector('[data-role="smart"]');
    if (!conv.smart) {
      if (node) node.remove();
      return false;
    }
    var html = smartHTML(conv);
    if (!node) {
      box.insertAdjacentHTML('beforeend', html);
      return true;
    }
    /* não redesenha enquanto o operador digita na edição */
    if (conv.smart.editing && node.classList.contains('smart--edit')) return false;
    node.outerHTML = html;
    return true;
  }

  /* contador regressivo, atualizado a cada segundo sem redesenhar o bloco */
  function tickSmart() {
    if (!S.simRunning) return;
    Object.keys(cards).forEach(function (id) {
      var conv = sel.byId(id);
      if (!conv || !conv.smart || conv.smart.editing) return;
      var out = cards[id].querySelector('[data-role="smart-t"]');
      if (!out) return;
      var left = smartSecondsLeft(conv);
      out.textContent = left + 's';
      var chip = out.parentNode;
      if (left <= 2) chip.classList.add('smart__timer--urgent');
      else chip.classList.remove('smart__timer--urgent');
    });
  }

      var foot = document.createElement('div');
      foot.className = 'modal__foot';
      foot.innerHTML =
        '<button type="button" class="btn" data-act="sum-copy" data-id="' + conv.id + '">' +
          ic('file', 'icon--sm') + 'Copiar resumo</button>' +
        '<button type="button" class="btn btn--primary" data-act="modal-close">Fechar</button>';
      box.parentNode.appendChild(foot);
    }, 750);
  }

  /* --------------------------------------------- base de conhecimento */
  function openKnowledgeModal(convId) {
    var conv = sel.byId(convId);
    if (!conv) return;

    var picked = kbSelection(conv);
    if (!picked.length) return;

    /* mensagens na ordem em que foram enviadas */
    var msgs = conv.messages.filter(function (m) { return picked.indexOf(m.id) !== -1; });
    if (!msgs.length) return;

    /* a pergunta é a última fala do cliente antes da primeira resposta marcada */
    var firstAt = conv.messages.indexOf(msgs[0]);
    var question = '';
    for (var i = firstAt - 1; i >= 0; i--) {
      if (conv.messages[i].author === 'customer') { question = conv.messages[i].text; break; }
    }

    var answer = msgs.map(function (m) { return m.text; }).join('\n');

    openModal(
      '<div class="modal" role="dialog" aria-modal="true" aria-label="Enviar para a base de conhecimento">' +
        '<div class="modal__head">' +
          '<div><h3>Ensinar a IA</h3>' +
          '<p>' + msgs.length + (msgs.length > 1 ? ' respostas selecionadas' : ' resposta selecionada') +
          ' · vira uma entrada na base de conhecimento</p></div>' +
          '<button type="button" class="icon-btn" data-act="modal-close" aria-label="Fechar">' + ic('close') + '</button>' +
        '</div>' +
        '<div class="modal__body">' +
          '<label class="field"><span>Pergunta do cliente</span>' +
            '<textarea class="textarea" data-role="kb-q" rows="2">' + U.esc(question) + '</textarea></label>' +
          '<label class="field"><span>Resposta que a IA deve dar</span>' +
            '<textarea class="textarea" data-role="kb-a" rows="' + Math.min(6, 2 + msgs.length) + '">' +
            U.esc(answer) + '</textarea></label>' +
          '<label class="field"><span>Tópico</span><select class="select" data-role="kb-topic">' +
            SO.knowledge.topics.map(function (t) {
              return '<option value="' + U.esc(t) + '">' + U.esc(t) + '</option>';
            }).join('') + '</select></label>' +
          '<p class="hint" data-role="hint">As mensagens marcadas entram juntas como uma única ' +
            'resposta. A IA usa o par pergunta/resposta quando outro cliente trouxer um pedido parecido.</p>' +
        '</div>' +
        '<div class="modal__foot">' +
          '<button type="button" class="btn" data-act="modal-close">Cancelar</button>' +
          '<button type="button" class="btn btn--primary" data-act="kb-confirm" data-id="' + convId + '">' +
            ic('sparkle', 'icon--sm') + 'Enviar para a base</button>' +
        '</div>' +
      '</div>'
    );
  }
