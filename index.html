<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Super Operador Voll 360°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ==========================================================================
   Super Operador — Voll 360°
   Tokens espelhados do design system do voll-frontend (tema "dark":
   src/design/_variables-dark.scss)
   ========================================================================== */

:root {
  /* superfícies */
  --bg:            #131c21;
  --bg-elevated:   #172126;
  --surface:       #2a2f32;
  --surface-2:     #222a2e;
  --surface-3:     #313739;
  --border:        #363b3d;
  --border-soft:   #2c3235;

  /* texto */
  --text:          #ffffff;
  --text-dim:      rgba(255, 255, 255, .68);
  --text-faint:    rgba(255, 255, 255, .42);

  /* marca e semântica (Skote dark) */
  --primary:       #556ee6;
  --primary-dark:  #3f56cc;
  --primary-soft:  rgba(85, 110, 230, .16);
  --info:          #50a5f1;
  --info-soft:     rgba(80, 165, 241, .14);
  --success:       #34c38f;
  --success-soft:  rgba(52, 195, 143, .14);
  --warning:       #f1b44c;
  --warning-soft:  rgba(241, 180, 76, .14);
  --danger:        #f46a6a;
  --danger-soft:   rgba(244, 106, 106, .16);
  --purple:        #a389f4;
  --purple-soft:   rgba(163, 137, 244, .14);
  --orange:        #f1734f;
  --orange-soft:   rgba(241, 115, 79, .14);

  /* canais */
  --ch-whatsapp:   #25d366;
  --ch-telegram:   #50a5f1;
  --ch-facebook:   #6c7ae0;
  --ch-webchat:    #34c38f;
  --ch-email:      #f1b44c;

  --radius:        4px;
  --radius-lg:     6px;
  --shadow:        0 6px 18px rgba(0, 0, 0, .35);

  --topbar-h:      62px;
  --rail-w:        48px;
  --sidebar-w:     328px;

  --font:          'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono:     'JetBrains Mono', 'Consolas', ui-monospace, monospace;

  /* superfícies de interação e textos sobre fundos coloridos */
  --hover-soft:    rgba(255, 255, 255, .035);
  --hover:         rgba(255, 255, 255, .07);
  --hover-strong:  rgba(255, 255, 255, .1);
  --chip-bg:       rgba(255, 255, 255, .05);
  --track:         rgba(255, 255, 255, .13);
  --border-hover:  #4a5154;
  --scroll:        #444b4e;
  --overlay:       rgba(6, 12, 15, .68);
  --overlay-solid: rgba(6, 12, 15, .94);
  --on-primary:    #b7c2ff;
  --on-success:    #a9e8cf;
  --on-warning:    #ffd27d;
  --on-danger:     #ffc9c9;
  --on-orange:     #ffc0a8;
  --on-info:       #b9dcff;
}

/* ==========================================================================
   Tema claro — mesma estrutura de tokens, para a interface não mudar de forma
   ========================================================================== */

:root[data-so-theme="light"] {
  --bg:            #eef1f4;
  --bg-elevated:   #ffffff;
  --surface:       #ffffff;
  --surface-2:     #f5f7f9;
  --surface-3:     #e9edf0;
  --border:        #d8dee3;
  --border-soft:   #e6eaee;

  --text:          #1b2429;
  --text-dim:      rgba(27, 36, 41, .74);
  --text-faint:    rgba(27, 36, 41, .52);

  --primary:       #4458c9;
  --primary-dark:  #33459f;
  --primary-soft:  rgba(68, 88, 201, .1);
  --info:          #2f6fb0;
  --info-soft:     rgba(47, 111, 176, .1);
  --success:       #157f5c;
  --success-soft:  rgba(21, 127, 92, .1);
  --warning:       #8a5c00;
  --warning-soft:  rgba(138, 92, 0, .12);
  --danger:        #c0392b;
  --danger-soft:   rgba(192, 57, 43, .1);
  --purple:        #6b4fd0;
  --purple-soft:   rgba(107, 79, 208, .1);
  --orange:        #b4491f;
  --orange-soft:   rgba(180, 73, 31, .1);

  --hover-soft:    rgba(27, 36, 41, .035);
  --hover:         rgba(27, 36, 41, .06);
  --hover-strong:  rgba(27, 36, 41, .09);
  --chip-bg:       rgba(27, 36, 41, .05);
  --track:         rgba(27, 36, 41, .12);
  --border-hover:  #b9c2c8;
  --scroll:        #c2cacf;
  --overlay:       rgba(27, 36, 41, .42);
  --overlay-solid: rgba(238, 241, 244, .95);
  --on-primary:    #33459f;
  --on-success:    #0f5f45;
  --on-warning:    #6d4900;
  --on-danger:     #98291d;
  --on-orange:     #8f3a19;
  --on-info:       #235c8f;

  --shadow:        0 6px 18px rgba(27, 36, 41, .12);
}

*, *::before, *::after { box-sizing: border-box; }

/* precisa vencer as regras de display das classes (.rec, .popover, etc.) */
[hidden] { display: none !important; }

html { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  min-height: 620px;
  overflow: hidden;
}

.icon { width: 16px; height: 16px; flex: none; display: block; }
.icon--sm { width: 14px; height: 14px; }
.icon--lg { width: 20px; height: 20px; }

.label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* scrollbars ------------------------------------------------------------- */
.scroll::-webkit-scrollbar, .sidebar__list::-webkit-scrollbar,
.msgs::-webkit-scrollbar, .popover::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll::-webkit-scrollbar-thumb, .sidebar__list::-webkit-scrollbar-thumb,
.msgs::-webkit-scrollbar-thumb, .popover::-webkit-scrollbar-thumb {
  background: var(--scroll); border-radius: 10px;
}
.scroll::-webkit-scrollbar-track, .sidebar__list::-webkit-scrollbar-track,
.msgs::-webkit-scrollbar-track, .popover::-webkit-scrollbar-track { background: transparent; }

/* ==========================================================================
   Topbar
   ========================================================================== */

.topbar {
  height: var(--topbar-h);
  flex: none;
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

/* identificação do operador — ocupa a coluna da lista */
.ident {
  display: flex;
  align-items: center;
  gap: 9px;
  width: calc(var(--rail-w) + var(--sidebar-w));
  flex: none;
  padding: 0 12px 0 14px;
  background: var(--bg-elevated);
  border-right: 1px solid var(--border);
}

.ident__av {
  position: relative;
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--primary); color: #fff;
  font-size: 11.5px; font-weight: 600;
}
.ident__av--paused { background: var(--warning); color: #1b1400; }

.ident__txt { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; flex: 1; }
.ident__txt strong {
  font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ident__role {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9.5px; color: var(--text-faint);
  letter-spacing: .07em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ident__role--paused { color: var(--warning); letter-spacing: .03em; }

.ident__sim { flex: none; background: var(--surface-2); }

.topbar__end { display: flex; align-items: center; gap: 6px; flex: none; padding: 0 10px; }

.icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-dim);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn--sm { width: 24px; height: 24px; }
.icon-btn--outline { border-color: var(--border); background: var(--surface-2); }
.icon-btn--outline:hover { border-color: var(--border-hover); }
.icon-btn--danger:hover { background: var(--danger-soft); color: var(--danger); }
.icon-btn--warning { background: var(--warning-soft); border-color: rgba(241,180,76,.35); color: var(--warning); }
.icon-btn--warning:hover { background: rgba(241,180,76,.22); color: var(--on-warning); }
.icon-btn--success { background: var(--success-soft); border-color: rgba(52,195,143,.35); color: var(--success); }
.icon-btn--success:hover { background: rgba(52,195,143,.22); color: var(--on-success); }

.bell-wrap { position: relative; }
.bell-wrap .dot {
  position: absolute; top: 4px; right: 5px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger);
  border: 2px solid var(--surface);
}

/* ==========================================================================
   Botões
   ========================================================================== */

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-3);
  color: var(--text-dim);
  font-size: 11.5px; font-weight: 500;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.btn:hover { color: var(--text); border-color: var(--border-hover); }
.btn--ghost { background: transparent; }
.btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn--primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: #fff; }
.btn--warning { background: var(--warning-soft); border-color: rgba(241,180,76,.4); color: var(--warning); }
.btn--warning:hover { color: var(--on-warning); }
.btn--danger { background: var(--danger-soft); border-color: rgba(244,106,106,.45); color: var(--danger); }
.btn--success { background: var(--success-soft); border-color: rgba(52,195,143,.4); color: var(--success); }
.btn--info { background: var(--info-soft); border-color: rgba(80,165,241,.4); color: var(--info); }
.btn--sm { height: 24px; padding: 0 8px; font-size: 11px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ==========================================================================
   Métricas
   ========================================================================== */

.metrics {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  background: var(--surface);
}

.metric {
  flex: 1 1 0;
  min-width: 116px;
  display: flex; flex-direction: column; justify-content: center;
  gap: 1px;
  padding: 0 14px;
  background: transparent;
  border: 0; border-top: 2px solid transparent;
  border-right: 1px solid var(--border-soft);
  text-align: left;
  transition: background .15s;
}
.metric:hover { background: var(--hover-soft); }
.metric[aria-pressed="true"] { background: rgba(85,110,230,.12); border-top-color: var(--primary); }
.metric__k {
  font-size: 9.5px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-faint);
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.metric__v {
  font-family: var(--font-mono);
  font-size: 19px; font-weight: 500; line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.metric--static { cursor: default; border-right: 0; }
.metric--static:hover { background: transparent; }
.metric--alert .metric__k { color: var(--danger); }
.metric--alert .metric__v { color: var(--danger); }
.metric__tick { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ==========================================================================
   Layout
   ========================================================================== */

.layout { flex: 1; min-height: 0; display: flex; }

.sidebar {
  position: relative;
  width: var(--sidebar-w);
  flex: none;
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--bg-elevated);
  border-right: 1px solid var(--border);
}

/* sinaliza o fim da lista, para o scroll não parecer infinito */
.sidebar::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0; height: 22px;
  background: linear-gradient(transparent, var(--bg-elevated));
  pointer-events: none;
}

.sidebar__search {
  position: relative;
  display: flex; align-items: center;
  padding: 9px 12px 6px;
}
.sidebar__search-icon {
  position: absolute; left: 23px; top: 50%; transform: translateY(-40%);
  color: var(--text-faint); pointer-events: none;
}
.sidebar__search #searchClear { position: absolute; right: 18px; }

.input {
  width: 100%;
  height: 34px;
  padding: 0 30px 0 32px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
}
.input::placeholder { color: var(--text-faint); }
.input:focus { border-color: var(--primary); outline: none; }
.input[type="search"]::-webkit-search-cancel-button { display: none; }

.sidebar__filters { padding: 2px 12px 10px; border-bottom: 1px solid var(--border-soft); }
.sidebar__filters-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 8px; }
.sidebar__count { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  height: 22px; padding: 0 9px;
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--border);
  border-radius: 40px;
  background: transparent;
  color: var(--text-dim);
  font-size: 10.5px; font-weight: 500;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { color: var(--text); border-color: var(--border-hover); }
.chip[aria-pressed="true"] {
  background: var(--primary-soft);
  border-color: rgba(85,110,230,.55);
  color: var(--on-primary);
}
.chip__n { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
.chip[aria-pressed="true"] .chip__n { color: var(--on-primary); }

.sidebar__list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 10px; }

/* barra vertical de sessão, à esquerda da lista */
.rail {
  width: var(--rail-w);
  flex: none;
  display: flex; flex-direction: column; align-items: center;
  gap: 6px;
  padding: 10px 0 12px;
  background: var(--bg);
  border-right: 1px solid var(--border);
}
.rail__sep { flex: 1; }

.rail__btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-dim);
  transition: background .15s, color .15s, border-color .15s;
}
.rail__btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-hover); }
.rail__btn--on {
  background: var(--success-soft); border-color: rgba(52,195,143,.4); color: var(--success);
}
.rail__btn--warn {
  background: var(--warning-soft); border-color: rgba(241,180,76,.45); color: var(--warning);
}
.rail__btn--danger:hover { background: var(--danger-soft); border-color: rgba(244,106,106,.45); color: var(--danger); }

.group {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  padding: 9px 14px 7px;
  background: linear-gradient(var(--bg-elevated) 82%, transparent);
  backdrop-filter: blur(2px);
}
.group__t { font-size: 9.5px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; color: var(--text-faint); }
.group__n {
  font-family: var(--font-mono); font-size: 9.5px;
  padding: 1px 6px; border-radius: 20px;
  background: var(--surface-2); color: var(--text-dim);
  border: 1px solid var(--border-soft);
}
.group--open .group__t { color: var(--on-primary); }

.group-empty { padding: 0 14px 10px; font-size: 11px; color: var(--text-faint); }

/* item da lista ---------------------------------------------------------- */

.conv {
  position: relative;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 10px;
  padding: 9px 12px 10px 14px;
  border-bottom: 1px solid var(--border-soft);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background .12s;
}
.conv:hover { background: var(--hover-soft); }
.conv[data-open="true"] { background: rgba(85,110,230,.09); border-left-color: var(--primary); }

.conv__av {
  position: relative;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--av, #3a4145);
  color: #fff; font-size: 11.5px; font-weight: 600;
}
.conv__ch {
  position: absolute; right: -3px; bottom: -3px;
  z-index: 2;   /* fica acima do anel de SLA, que passa por tras dele */
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--bg-elevated);
  background: var(--ch, var(--primary));
}
.conv__body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.conv__row { display: flex; align-items: center; gap: 8px; }
.conv__name {
  font-size: 12.5px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1; min-width: 0;
}
.conv__time { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); flex: none; }
.conv__proto { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-faint); letter-spacing: .01em; }
.conv__last {
  font-size: 11.5px; color: var(--text-dim);
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  overflow: hidden;
}
.conv__last b { font-weight: 500; color: var(--text-faint); }
.conv__tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.conv__slot {
  flex: none;
  display: inline-flex; align-items: center; gap: 3px;
  height: 15px; padding: 0 4px;
  font-family: var(--font-mono); font-size: 9px;
  border-radius: 3px;
  background: var(--primary-soft); color: var(--on-primary);
  border: 1px solid rgba(85,110,230,.4);
}
.conv__slot svg { width: 10px; height: 10px; }

.conv__unread {
  flex: none;
  min-width: 16px; height: 16px; padding: 0 4px;
  display: inline-grid; place-items: center;
  border-radius: 20px;
  background: var(--primary); color: #fff;
  font-family: var(--font-mono); font-size: 9px;
}

/* badges ----------------------------------------------------------------- */

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 17px; padding: 0 6px;
  border-radius: 3px;
  font-size: 9.5px; font-weight: 500; letter-spacing: .02em;
  white-space: nowrap;
  border: 1px solid transparent;
}
.tag svg { width: 10px; height: 10px; }
.tag--ia      { background: var(--info-soft);    color: var(--info);    border-color: rgba(80,165,241,.32); }
.tag--pausada { background: var(--warning-soft); color: var(--warning); border-color: rgba(241,180,76,.32); }
.tag--oper    { background: var(--primary-soft); color: var(--on-primary);        border-color: rgba(85,110,230,.4); }
.tag--wait    { background: var(--chip-bg); color: var(--text-dim); border-color: var(--border); }
.tag--tab     { background: var(--purple-soft);  color: var(--purple);  border-color: rgba(163,137,244,.32); }
.tag--transf  { background: var(--chip-bg); color: var(--text-dim); border-color: var(--border); }
.tag--ok      { background: var(--success-soft);  color: var(--success); border-color: rgba(52,195,143,.3); }
.tag--warn    { background: var(--warning-soft);  color: var(--warning); border-color: rgba(241,180,76,.3); }
.tag--crit    { background: var(--danger-soft);   color: var(--danger);  border-color: rgba(244,106,106,.4); }
.tag--neutral { background: var(--chip-bg); color: var(--text-dim); border-color: var(--border); }
.tag--alert   { background: var(--danger); color: #fff; border-color: var(--danger); }
.tag--alert-warn { background: var(--warning); color: #1b1400; border-color: var(--warning); }

/* ==========================================================================
   Workspace
   ========================================================================== */

.workspace { flex: 1; min-width: 0; min-height: 0; padding: 12px; background: var(--bg); }

.empty {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(42,47,50,.35), rgba(42,47,50,.12));
}
.empty__ic {
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface); color: var(--text-faint);
  border: 1px solid var(--border);
}
.empty__ic svg { width: 24px; height: 24px; }
.empty h2 { margin: 0; font-size: 15px; font-weight: 500; }
.empty p { margin: 0; max-width: 46ch; font-size: 12px; color: var(--text-dim); }
.empty__hint { font-size: 11px; color: var(--text-faint); }

.grid { display: grid; gap: 12px; height: 100%; }
.grid[data-count="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.grid[data-count="2"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.grid[data-count="3"] { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
.grid[data-count="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

/* card ------------------------------------------------------------------- */

.card {
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.card--focus { box-shadow: 0 0 0 2px var(--primary); }
.card--nudge { animation: nudge .3s ease-in-out 2; }

.card__head {
  flex: none;
  position: relative;
  display: flex; flex-direction: column; gap: 6px;
  padding: 7px 8px 7px 10px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.card__top { display: flex; align-items: center; gap: 7px; }
.card__av {
  position: relative;
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--av, #3a4145); color: #fff; font-size: 10.5px; font-weight: 600;
}
.card__av .conv__ch { border-color: var(--surface-2); }
.card__name {
  flex: 1; min-width: 0;
  font-size: 13px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card__ctrl { display: flex; align-items: center; gap: 4px; flex: none; }

.card__sub {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 3px 6px;
  min-width: 0;
  font-size: 10px; color: var(--text-faint);
}
.card__sub .sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; flex: none; }
.card__proto { font-size: 9.5px; flex: none; }
.card__chan { flex: none; }
.card__tags { display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; min-width: 0; margin-left: 2px; }
/* detalhe do alerta: informativo, sem pintar o atendimento de vermelho */
.card__alertbar {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 7px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--danger);
  font-size: 11px; color: var(--text-dim);
}
.card__alertbar svg { color: var(--danger); }
.card__alertbar span { flex: 1; min-width: 0; }

/* mensagens -------------------------------------------------------------- */

.msgs {
  flex: 1; min-height: 0;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 7px;
  padding: 10px 10px 12px;
  background:
    radial-gradient(1200px 400px at 70% -5%, rgba(85,110,230,.05), transparent 60%),
    var(--bg);
}

/* Nada dentro da conversa encolhe: quem tem overflow:hidden (o bloco do envio
   inteligente) perde a altura minima automatica e o flex achata ate virar um risco. */
.msgs > * { flex: none; }

.day { align-self: center; margin: 2px 0 4px; }
.day span {
  font-family: var(--font-mono); font-size: 9.5px;
  padding: 2px 9px; border-radius: 20px;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  color: var(--text-faint);
}

.msg { max-width: 84%; display: flex; flex-direction: column; }
.msg--cont { margin-top: -4px; }
.msg--customer { align-self: flex-start; }
.msg--ai { align-self: flex-end; }
.msg--operator { align-self: flex-end; }

.msg__col { display: flex; flex-direction: column; min-width: 0; }
/* modo de seleção: a caixa de marcação entra à esquerda da própria mensagem */
.msg--pickable { flex-direction: row; align-items: flex-end; gap: 6px; }

.bubble {
  padding: 5px 9px 4px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 12.5px;
  line-height: 1.42;
  word-break: break-word;
}
.bubble__who {
  display: flex; align-items: center; gap: 5px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  margin-bottom: 3px;
  color: var(--text-faint);
}
.bubble__who svg { width: 11px; height: 11px; }
.bubble__txt { white-space: pre-wrap; }
.bubble__time {
  display: block; text-align: right;
  font-family: var(--font-mono); font-size: 9px;
  color: var(--text-faint); margin-top: 2px;
}

.msg--customer .bubble { background: var(--surface); }
.msg--customer .bubble__who { color: var(--text-dim); }

.msg--ai .bubble {
  background: linear-gradient(180deg, rgba(80,165,241,.10), rgba(80,165,241,.05));
  border-color: rgba(80,165,241,.35);
  border-right: 2px solid var(--info);
}
.msg--ai .bubble__who { color: var(--info); }

.msg--operator .bubble {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.msg--operator .bubble__who { color: rgba(255,255,255,.8); }
.msg--operator .bubble__time { color: rgba(255,255,255,.7); }

.msg--system { align-self: center; max-width: 92%; }
.msg--system .sys {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  font-size: 10.5px; color: var(--text-dim);
  text-align: center;
}
.msg--system .sys svg { width: 11px; height: 11px; color: var(--text-faint); }
.msg--system[data-kind="alert"] .sys { border-color: rgba(244,106,106,.5); color: var(--on-danger); }
.msg--system[data-kind="alert"] .sys svg { color: var(--danger); }
.msg--system[data-kind="ok"] .sys { border-color: rgba(52,195,143,.45); color: var(--on-success); }
.msg--system[data-kind="ok"] .sys svg { color: var(--success); }

.attach {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 2px;
}
.attach__ic {
  width: 26px; height: 26px; border-radius: var(--radius);
  display: grid; place-items: center; flex: none;
  background: var(--hover-strong);
}
.attach__n { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach__s { font-size: 9.5px; opacity: .7; font-family: var(--font-mono); }

.audio { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
.audio__wave { display: flex; align-items: center; gap: 2px; height: 18px; }
.audio__wave i {
  width: 2px; border-radius: 2px; background: currentColor; opacity: .75;
  height: var(--h, 8px);
}
.audio__t { font-family: var(--font-mono); font-size: 10px; opacity: .85; }

.typing { display: flex; align-items: center; gap: 6px; align-self: flex-start; padding: 2px 4px; }
.typing__label { font-size: 10px; color: var(--info); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.typing__dots { display: flex; gap: 3px; }
.typing__dots i {
  width: 4px; height: 4px; border-radius: 50%; background: var(--info);
  animation: blip 1.1s infinite ease-in-out;
}
.typing__dots i:nth-child(2) { animation-delay: .15s; }
.typing__dots i:nth-child(3) { animation-delay: .3s; }

/* rodapé bloqueado (IA no comando) -------------------------------------- */

.locked {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px 7px 10px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.locked svg { color: var(--text-faint); flex: none; }
.locked__t {
  flex: 1; min-width: 0;
  font-size: 10.5px; color: var(--text-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* composer --------------------------------------------------------------- */

.composer {
  flex: none;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  padding: 8px 10px 9px;
  display: flex; flex-direction: column; gap: 7px;
  position: relative;
}

.composer__meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; min-width: 0;
}

.composer__note {
  display: flex; align-items: center; gap: 6px;
  min-width: 0; flex: 1;
  font-size: 10.5px; color: var(--text-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.composer__note svg { flex: none; }
.composer__note svg { width: 12px; height: 12px; }
.composer__note--ia { color: var(--info); }

.composer__file {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 11px;
}
.composer__file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer__file .size { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-faint); }

.composer__box {
  display: flex; align-items: flex-end; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 4px 4px 8px;
}
.composer__box:focus-within { border-color: var(--primary); }
.composer textarea {
  flex: 1; min-width: 0;
  border: 0; background: transparent; resize: none;
  padding: 5px 2px; margin: 0;
  font-size: 12px; line-height: 1.45;
  max-height: 88px; min-height: 26px;
}
.composer textarea:focus { outline: none; }
.composer textarea::placeholder { color: var(--text-faint); }

.composer__tools { display: flex; align-items: center; gap: 2px; flex: none; }
.send-btn {
  width: 28px; height: 28px; border: 0; border-radius: var(--radius);
  display: grid; place-items: center;
  background: var(--primary); color: #fff;
}
.send-btn:hover { background: var(--primary-dark); }
.send-btn[disabled] { opacity: .4; cursor: not-allowed; }

.composer__actions { display: flex; gap: 5px; flex: none; }

.composer[data-rec="true"] .composer__box,
.composer[data-rec="true"] .composer__actions { display: none; }

.rec {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px;
  border: 1px solid rgba(244,106,106,.5);
  border-radius: var(--radius);
  background: var(--danger-soft);
}
.rec__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); animation: softFlash 1s infinite; }
.rec__t { font-family: var(--font-mono); font-size: 12px; color: var(--on-danger); }
.rec__l { font-size: 11px; color: var(--on-danger); flex: 1; }

/* popovers --------------------------------------------------------------- */

.popover {
  position: absolute;
  z-index: 40;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 8px;
}
.popover--emoji {
  bottom: 100%; left: 8px; margin-bottom: 6px;
  width: 232px;
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
}
.popover--emoji button {
  height: 26px; border: 0; background: transparent; border-radius: var(--radius);
  font-size: 15px; line-height: 1;
}
.popover--emoji button:hover { background: var(--hover-strong); }

.popover--menu {
  right: 6px; top: calc(100% + 2px);
  width: 210px;
  max-height: 216px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1px;
  padding: 4px;
}
.menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  border: 0; border-radius: var(--radius);
  background: transparent; color: var(--text-dim);
  font-size: 11.5px; text-align: left;
}
.menu-item svg { color: var(--text-faint); }
.menu-item:hover { background: var(--hover); color: var(--text); }
.menu-item:hover svg { color: var(--text-dim); }
.menu-item--danger { color: var(--danger); }
.menu-item--danger svg { color: var(--danger); }
.menu-item--danger:hover { background: var(--danger-soft); color: var(--danger); }

.popover--bell {
  right: 0; top: calc(100% + 8px);
  width: 320px; max-height: 380px; overflow-y: auto;
  padding: 0;
}
.popover--bell .bell-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-bottom: 1px solid var(--border-soft);
  position: sticky; top: 0; background: var(--surface);
}
.notif { display: flex; gap: 9px; padding: 9px 12px; border-bottom: 1px solid var(--border-soft); }
.notif:last-child { border-bottom: 0; }
.notif__ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-3); }
.notif__b { min-width: 0; }
.notif__t { font-size: 11.5px; }
.notif__m { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); }
.notif--alert .notif__ic { background: var(--danger-soft); color: var(--danger); }
.notif--ok .notif__ic { background: var(--success-soft); color: var(--success); }
.notif--info .notif__ic { background: var(--info-soft); color: var(--info); }
.bell-empty { padding: 22px 12px; text-align: center; font-size: 11.5px; color: var(--text-faint); }

/* ==========================================================================
   Modal
   ========================================================================== */

.modal-root:empty { display: none; }
.overlay {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  padding: 20px;
  background: var(--overlay);
  animation: fade .14s ease-out;
}
.overlay--solid { background: var(--overlay-solid); backdrop-filter: blur(2px); }
.modal {
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  animation: rise .16s ease-out;
}
.modal__head {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border-soft);
}
.modal__head h3 { margin: 0; font-size: 14px; font-weight: 500; }
.modal__head p { margin: 2px 0 0; font-size: 11px; color: var(--text-faint); }
.modal__head .icon-btn { margin-left: auto; }
.modal__body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.modal__foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid var(--border-soft);
  background: var(--surface-2);
}

.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); }
.select, .textarea {
  height: 34px; padding: 0 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text); font-size: 12px;
}
.textarea { height: auto; min-height: 58px; padding: 8px 10px; resize: vertical; font-family: var(--font); }
.select option { background: var(--surface-2); color: var(--text); }
.select:focus, .textarea:focus { border-color: var(--primary); outline: none; }
.hint { font-size: 10.5px; color: var(--text-faint); }
.hint--err { color: var(--danger); }


/* ==========================================================================
   Animações
   ========================================================================== */

@keyframes softFlash { 0%, 100% { opacity: 1; } 50% { opacity: .38; } }
@keyframes blip { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-3px); opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slide { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-3px); }
  75%      { transform: translateX(3px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ==========================================================================
   Responsivo (foco desktop)
   ========================================================================== */

@media (max-width: 1500px) {
  .msg { max-width: 88%; }
}
@media (max-width: 1300px) {
  :root { --sidebar-w: 300px; }
  .metric { min-width: 118px; padding: 0 12px; }
  .metric__v { font-size: 17px; }
}
@media (max-width: 1080px) {
  :root { --sidebar-w: 268px; }
  .metric { min-width: 104px; padding: 0 10px; }
}
@media (max-width: 880px) {
  .grid { grid-template-columns: 1fr !important; grid-auto-rows: minmax(340px, 1fr); overflow-y: auto; }
}

/* ==========================================================================
   SLA estourado: em vez de piscar, o ícone do cliente ganha um contador girando
   ========================================================================== */

.av--sla::after {
  content: '';
  position: absolute; inset: -4px;
  z-index: 1;
  border-radius: 50%;
  /* anel de progresso: enche conforme o tempo de espera */
  background: conic-gradient(var(--sla-color, var(--success)) calc(var(--sla-pct, 0) * 1%),
    var(--track) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
}
.av--sla-green::after  { --sla-color: var(--success); }
.av--sla-yellow::after { --sla-color: var(--warning); }
/* estourou: o anel fica cheio e passa a girar (com degradê, para o giro ser visível) */
.av--sla-red::after {
  --sla-color: var(--danger);
  background: conic-gradient(from 0deg, rgba(244, 106, 106, .12), var(--danger));
  animation: spin 1.1s linear infinite;
}

/* estourou mas já foi respondido: anel cheio e parado */
.av--sla-stopped::after {
  background: conic-gradient(var(--danger) 100%, var(--danger));
  animation: none;
}


@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .av--sla::after { animation: none; }
}


/* ==========================================================================
   Conversa ativa: buscar contato, canal e modelo de mensagem (HSM)
   ========================================================================== */

.sidebar__search { gap: 6px; }
.sidebar__search .input { flex: 1; }
.sidebar__search #searchClear { right: 52px; }
.sidebar__new { flex: none; width: 34px; height: 34px; }

.modal--wide { max-width: 880px; }

.finder {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.finder__field { flex: none; width: 150px; }
.finder__input { flex: 1; min-width: 180px; padding: 0 10px; }
.finder__count { display: flex; align-items: center; justify-content: space-between; }

.switch {
  display: inline-flex; align-items: center; gap: 7px;
  flex: none; font-size: 11.5px; color: var(--text-dim);
  cursor: pointer;
}
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch__track {
  position: relative;
  width: 32px; height: 18px; border-radius: 20px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  transition: background .15s, border-color .15s;
}
.switch__track::after {
  content: '';
  position: absolute; top: 2px; left: 2px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--text-faint);
  transition: transform .15s, background .15s;
}
.switch input:checked + .switch__track { background: var(--primary-soft); border-color: rgba(85,110,230,.6); }
.switch input:checked + .switch__track::after { transform: translateX(14px); background: var(--primary); }
.switch input:focus-visible + .switch__track { outline: 2px solid var(--primary); outline-offset: 1px; }

.contacts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
  max-height: 46vh;
  overflow-y: auto;
  padding-right: 2px;
}

.contact {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  padding: 12px 10px 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.contact:hover { border-color: var(--primary); background: rgba(85,110,230,.08); }

.contact__av {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--av, #3a4145); color: #fff;
  font-size: 13px; font-weight: 600;
}
.contact__name {
  font-size: 12.5px; font-weight: 500;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.contact__phone { font-size: 10.5px; color: var(--text-faint); }

.contact__chs { display: flex; gap: 4px; margin: 2px 0 4px; }
.contact__ch { width: 10px; height: 10px; border-radius: 50%; background: var(--ch, var(--primary)); }

.contact__meta {
  display: flex; flex-direction: column; gap: 2px;
  width: 100%; text-align: left;
  font-size: 10px; color: var(--text-dim);
}
.contact__meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact__meta b { color: var(--text-faint); font-weight: 500; }

.contact__hist {
  margin-top: 6px;
  border: 0; background: transparent;
  color: var(--on-primary); font-size: 10.5px;
  text-decoration: underline;
}
.contact__hist:hover { color: var(--on-primary); }

/* seleção de canal ------------------------------------------------------- */
.ch-options { display: flex; flex-direction: column; gap: 6px; }

.ch-option {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
  transition: border-color .15s, background .15s;
}
.ch-option:hover { border-color: var(--primary); background: rgba(85,110,230,.08); }
.ch-option__dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ch, var(--primary)); flex: none; }
.ch-option__txt { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.ch-option__txt strong { font-size: 12.5px; font-weight: 500; }
.ch-option__txt span { font-size: 10.5px; color: var(--text-faint); }

/* modelo (HSM) ----------------------------------------------------------- */
.field--row > span { text-transform: none; letter-spacing: 0; font-size: 10.5px; }

.hsm-preview {
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--info);
  border-radius: var(--radius);
}
.hsm-preview p {
  margin: 0;
  font-size: 12.5px; line-height: 1.45;
  white-space: pre-wrap;
  color: var(--text);
}

.tpl-tag {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 4px;
  font-size: 9px; font-weight: 600; letter-spacing: .08em;
  color: rgba(255,255,255,.85);
}
.tpl-tag svg { width: 11px; height: 11px; }
.msg--operator .bubble .tpl-tag { color: rgba(255,255,255,.9); }

/* ==========================================================================
   Ícones de canal (no avatar, nos contatos e na escolha do canal)
   ========================================================================== */

.conv__ch {
  width: 15px; height: 15px;
  display: grid; place-items: center;
  color: #0d1417;
}
.conv__ch svg { width: 9px; height: 9px; }

.contact__ch {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--ch, var(--primary));
  color: #0d1417;
}
.contact__ch svg { width: 11px; height: 11px; }

.ch-option__dot {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--ch, var(--primary));
  color: #0d1417;
}
.ch-option__dot svg { width: 15px; height: 15px; }

/* ==========================================================================
   Seletor de layout (barra vertical) e aviso de limite na lista
   ========================================================================== */

.rail__layout { position: relative; display: flex; }

.popover--layout {
  left: calc(100% + 6px);
  bottom: 0;
  width: 232px;
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px;
}
.popover--layout > .label { padding: 2px 6px 6px; }

.layout-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-dim);
  text-align: left;
}
.layout-item:hover { background: var(--hover); color: var(--text); }
.layout-item--on {
  background: var(--primary-soft);
  border-color: rgba(85, 110, 230, .45);
  color: var(--on-primary);
}
.layout-item svg { flex: none; color: currentColor; }
.layout-item__txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.layout-item__txt strong { font-size: 12px; font-weight: 500; }
.layout-item__txt span { font-size: 10px; color: var(--text-faint); }
.layout-item--on .layout-item__txt span { color: inherit; opacity: .8; }

.group-limit {
  display: flex; align-items: flex-start; gap: 6px;
  margin: 0 12px 8px;
  padding: 7px 9px;
  border: 1px solid rgba(244, 106, 106, .4);
  border-radius: var(--radius);
  background: var(--danger-soft);
  color: var(--on-danger);
  font-size: 10.5px; line-height: 1.4;
}
.group-limit svg { flex: none; margin-top: 1px; color: var(--danger); }

/* sentimento: emoji + rótulo numa escala de cor (verde -> vermelho).
   Tudo em tom suave: o vermelho sólido continua exclusivo dos alertas. */
.tag--sent { gap: 5px; }
.tag--sent-green  { background: var(--success-soft); border-color: rgba(52,195,143,.38);  color: var(--on-success); }
.tag--sent-yellow { background: var(--warning-soft); border-color: rgba(241,180,76,.38);  color: var(--on-warning); }
.tag--sent-orange { background: var(--orange-soft);  border-color: rgba(241,115,79,.42);  color: var(--on-orange); }
.tag--sent-red    { background: var(--danger-soft);  border-color: rgba(244,106,106,.42); color: var(--on-danger); }
.tag--sent-crit   { background: var(--danger-soft);  border-color: var(--danger);         color: var(--on-danger); font-weight: 600; }
.face { width: 16px; height: 16px; flex: none; display: block; margin: -1px 0; }

/* foto de perfil do operador (quando definida em js/avatar.js) */
.ident__av--img { background: var(--surface-3); overflow: hidden; padding: 0; }
.ident__av--img img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transform: scale(1.14);   /* a arte tem margem; o zoom preenche o círculo */
}
.ident__av--img.ident__av--paused { box-shadow: 0 0 0 2px var(--warning); }

/* ==========================================================================
   Resumo do atendimento e base de conhecimento
   ========================================================================== */

.modal--sum { max-width: 560px; }

.sum__loading {
  display: flex; align-items: center; gap: 8px;
  padding: 18px 2px;
  font-size: 12px; color: var(--text-dim);
}
.sum__loading svg { color: var(--info); animation: softFlash 1.1s ease-in-out infinite; }

.sum__meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 10.5px; color: var(--text-faint);
}
.sum__meta .sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; }

.sum__block { display: flex; flex-direction: column; gap: 6px; }
.sum__block ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; }
.sum__block li { font-size: 12px; line-height: 1.45; color: var(--text-dim); }
.sum__lead { margin: 0; font-size: 12.5px; line-height: 1.45; }

.sum__next {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 10px 12px;
  border: 1px solid rgba(80, 165, 241, .35);
  border-left: 2px solid var(--info);
  border-radius: var(--radius);
  background: var(--info-soft);
  font-size: 12px; line-height: 1.45;
}
.sum__next svg { flex: none; color: var(--info); margin-top: 1px; }
.sum__next strong { display: block; font-weight: 500; margin-bottom: 2px; }

/* ação e selo por mensagem ------------------------------------------------ */
.kb-btn {
  align-self: flex-end;
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 3px; padding: 2px 8px;
  border: 1px dashed rgba(80, 165, 241, .45);
  border-radius: 20px;
  background: transparent;
  color: var(--info);
  font-size: 9.5px;
  transition: background .15s, border-color .15s;
}
.kb-btn:hover { background: var(--info-soft); border-color: var(--info); }
.kb-btn--on {
  background: var(--info-soft);
  border-style: solid; border-color: var(--info);
  font-weight: 600;
}

.kb-flag {
  align-self: flex-end;
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 3px; padding: 2px 7px;
  border-radius: 20px;
  background: var(--info-soft);
  border: 1px solid rgba(80, 165, 241, .35);
  color: var(--info);
  font-size: 9.5px;
}

/* caixa de seleção que substitui o botão "Ensinar a IA" assim que alguma
   mensagem já está marcada — deixa claro que dá para marcar mais de uma */
.kb-check {
  flex: none;
  /* contem o input absoluto: sem isso ele escapa para o documento e estica a pagina */
  position: relative;
  display: grid; place-items: center;
  width: 22px; height: 22px;
  margin-bottom: 2px;
  cursor: pointer;
}
.kb-check input {
  position: absolute; width: 1px; height: 1px;
  opacity: 0; pointer-events: none;
}
.kb-check__box {
  display: grid; place-items: center;
  width: 20px; height: 20px;
  border-radius: var(--radius);
  border: 1.5px solid rgba(80, 165, 241, .5);
  background: var(--surface-2);
  color: transparent;
  transition: background .15s, border-color .15s, color .15s;
}
.kb-check__box svg { width: 13px; height: 13px; }
.kb-check:hover .kb-check__box { border-color: var(--info); }
.kb-check--on .kb-check__box,
.kb-check--done .kb-check__box {
  background: var(--info); border-color: var(--info); color: #0d1417;
}
.kb-check--done { cursor: default; }
.kb-check--done .kb-check__box { width: 20px; height: 20px; border-radius: var(--radius); }

.kb-src {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 3px;
  font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--info);
}

/* lista da base ----------------------------------------------------------- */
.kb-list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; }

.kb-item {
  display: flex; flex-direction: column; gap: 5px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.kb-item__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kb-item p { margin: 0; display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.45; }
.kb-item p svg { flex: none; margin-top: 2px; }
.kb-item__q { color: var(--text-dim); }
.kb-item__q svg { color: var(--text-faint); }
.kb-item__a svg { color: var(--info); }

.rail__btn { position: relative; }
.rail__badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 15px; height: 15px; padding: 0 3px;
  display: grid; place-items: center;
  border-radius: 20px;
  background: var(--info); color: #0d1417;
  font-family: var(--font-mono); font-size: 9px;
}

/* barra de seleção para ensinar a IA com várias mensagens de uma vez */
.kb-bar {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  border-top: 1px solid rgba(80, 165, 241, .35);
  background: var(--info-soft);
}
.kb-bar svg { color: var(--info); flex: none; }
.kb-bar__t {
  flex: 1; min-width: 0;
  font-size: 11px; color: var(--info);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ==========================================================================
   Envio inteligente: bloco agrupado na conversa + painel de configuração
   ========================================================================== */

.smart {
  align-self: flex-end;
  max-width: 88%;
  margin-top: 4px;
  display: flex; flex-direction: column;
  border: 1px solid rgba(80, 165, 241, .45);
  border-radius: var(--radius-lg);
  background: var(--info-soft);
  overflow: hidden;
}

.smart__head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 9px;
  background: rgba(80, 165, 241, .12);
  border-bottom: 1px solid rgba(80, 165, 241, .3);
}
.smart__head svg { color: var(--info); flex: none; }
.smart__tag {
  flex: 1; min-width: 0;
  font-size: 9.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--info);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.smart__timer {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px;
  border-radius: 20px;
  background: var(--chip-bg);
  border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-dim);
}
.smart__timer svg { color: var(--text-faint); width: 11px; height: 11px; }
.smart__timer--urgent {
  border-color: rgba(241, 180, 76, .55);
  color: var(--on-warning);
}
.smart__timer--urgent svg { color: var(--warning); }

.smart__parts { display: flex; flex-direction: column; padding: 7px 9px; }
.smart__part {
  position: relative;
  margin: 0; padding: 3px 0 3px 22px;
  font-size: 12.5px; line-height: 1.42;
  white-space: pre-wrap; word-break: break-word;
}
.smart__n {
  position: absolute; left: 0; top: 4px;
  width: 16px; height: 16px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(80, 165, 241, .22);
  color: var(--info);
  font-family: var(--font-mono); font-size: 9px;
}

.smart__actions {
  display: flex; gap: 6px; justify-content: flex-end;
  padding: 7px 9px;
  border-top: 1px solid rgba(80, 165, 241, .25);
  background: rgba(0, 0, 0, .06);
}

.smart__edit { padding: 8px 9px; display: flex; flex-direction: column; gap: 5px; }
.smart__edit .textarea { min-height: 80px; font-size: 12.5px; }

/* mensagem já enviada que veio de um agrupamento */
.grouped-tag {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 3px;
  font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: rgba(255, 255, 255, .8);
}

/* painel no rail ---------------------------------------------------------- */
.rail__smart { position: relative; display: flex; }

.popover--smart {
  left: calc(100% + 6px);
  bottom: 0;
  width: 278px;
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px;
}
.popover--smart > .label { padding: 0 2px 6px; }
.popover--smart .hint { margin: 6px 2px 0; padding-top: 8px; border-top: 1px solid var(--border-soft); }

.cfg-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 2px;
  border-top: 1px solid var(--border-soft);
  font-size: 11.5px; color: var(--text-dim);
  cursor: pointer;
}
.cfg-row:first-of-type { border-top: 0; }

.cfg-num { display: inline-flex; align-items: center; gap: 5px; flex: none; }
.cfg-num .input { width: 54px; height: 28px; padding: 0 6px; text-align: center; }
.cfg-num em { font-style: normal; font-size: 10px; color: var(--text-faint); }

.rail__off {
  position: absolute; right: -3px; bottom: -3px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--text-faint);
  border: 2px solid var(--bg);
}

<script>
/* Estado central da aplicação + seletores derivados + event bus. */
window.SO = window.SO || {};

/* ------------------------------------------------------------------ util */
SO.util = (function () {
  var seq = 0;

  function uid(prefix) {
    seq += 1;
    return (prefix || 'id') + '_' + seq;
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function fmtTime(date) {
    return pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  function fmtClock(seconds) {
    return pad(Math.floor(seconds / 60)) + ':' + pad(seconds % 60);
  }

  function fmtDay(date) {
    var today = new Date();
    if (date.toDateString() === today.toDateString()) return 'Hoje';
    return pad(date.getDate()) + '/' + pad(date.getMonth() + 1) + '/' + date.getFullYear();
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function initials(name) {
    var parts = String(name).trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  function fmtSize(kb) {
    return kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB';
  }

  function digits(str) { return String(str).replace(/\D/g, ''); }

  return {
    uid: uid, pad: pad, fmtTime: fmtTime, fmtClock: fmtClock, fmtDay: fmtDay,
    esc: esc, initials: initials, pick: pick, fmtSize: fmtSize, digits: digits
  };
})();

/* ------------------------------------------------------------------- bus */
SO.bus = (function () {
  var handlers = {};

  function on(evt, fn) {
    (handlers[evt] = handlers[evt] || []).push(fn);
  }

  function emit(evt, payload) {
    (handlers[evt] || []).forEach(function (fn) { fn(payload); });
  }

  return { on: on, emit: emit };
})();

/* ----------------------------------------------------------------- state */
SO.state = {
  conversations: [],
  openIds: [],
  maxOpenConversations: 4,
  filter: 'todos',
  search: '',
  simRunning: true,
  finished: 0,
  theme: 'dark',
  /* envio inteligente: a IA agrupa mensagens antes de enviar */
  smartSend: { enabled: true, seconds: 5, max: 3 },
  smartOpen: false,
  layoutOpen: false,
  limitHintUntil: 0,
  operatorPaused: false,
  pausedSince: null,
  loggedOut: false,
  notifications: [],
  currentUser: {
    name: 'Stephany Oliveira',
    role: 'Super Operador',
    team: 'Squad IA · Produtos',
    initials: 'SO'
  }
};

/* ------------------------------------------------------------- seletores */
SO.select = (function () {
  var S = SO.state;

  var CHANNELS = {
    whatsapp: { label: 'WhatsApp', color: 'var(--ch-whatsapp)', icon: 'ch_whatsapp' },
    /* canal oficial: a primeira mensagem precisa ser um modelo aprovado (HSM) */
    wa_api:   { label: 'WhatsApp Business API', short: 'WhatsApp API', icon: 'ch_whatsapp',
                color: 'var(--ch-whatsapp)', requiresTemplate: true },
    telegram: { label: 'Telegram', color: 'var(--ch-telegram)', icon: 'ch_telegram' },
    facebook: { label: 'Facebook', color: 'var(--ch-facebook)', icon: 'ch_facebook' },
    webchat:  { label: 'Webchat',  color: 'var(--ch-webchat)', icon: 'ch_webchat' },
    email:    { label: 'E-mail',   color: 'var(--ch-email)', icon: 'ch_email' }
  };

  /* escala de sentimento no estilo medidor de satisfação: carinha (SO.icons.face)
     + rótulo + cor da tag, de verde a vermelho. Tag sempre em tom suave — o
     vermelho sólido continua exclusivo dos alertas. */
  var SENTIMENTS = {
    positive: { label: 'Positivo',  emoji: '😄', tone: 'green',  cls: 'tag--ok',      icon: 'check' },
    stable:   { label: 'Estável',   emoji: '😐', tone: 'yellow', cls: 'tag--neutral', icon: 'activity' },
    negative: { label: 'Negativo',  emoji: '😟', tone: 'orange', cls: 'tag--warn',    icon: 'activity' },
    impacted: { label: 'Impactado', emoji: '😠', tone: 'red',    cls: 'tag--crit',    icon: 'alert' },
    critical: { label: 'Crítico',   emoji: '🤬', tone: 'crit',   cls: 'tag--crit',    icon: 'alert' }
  };

  var PRIORITIES = {
    normal:    { label: 'Normal',   cls: 'tag--neutral' },
    attention: { label: 'Atenção',  cls: 'tag--warn' },
    critical:  { label: 'Crítico',  cls: 'tag--crit' }
  };

  function byId(id) {
    for (var i = 0; i < S.conversations.length; i++) {
      if (S.conversations[i].id === id) return S.conversations[i];
    }
    return null;
  }

  /* status derivado — a ordem define a precedência exibida */
  function statusOf(c) {
    if (c.tabulation) return { key: 'tabulado', label: 'Tabulado', cls: 'tag--tab', icon: 'tag' };
    if (c.transfer)   return { key: 'transferencia', label: 'Transferência solicitada', cls: 'tag--transf', icon: 'transfer' };
    /* conversa ativa iniciada pelo operador: modelo e primeira resposta */
    if (c.requiresTemplate && !c.templateSent)
      return { key: 'aguardando_modelo', label: 'Aguardando modelo de mensagem', cls: 'tag--warn', icon: 'bubbles' };
    if (c.awaitingFirstReply)
      return { key: 'aguardando_1a', label: 'Aguardando 1ª resposta do cliente', cls: 'tag--wait', icon: 'clock' };
    if (c.owner === 'operator') return { key: 'operador', label: 'Operador assumiu', cls: 'tag--oper', icon: 'user' };
    if (c.aiState === 'paused') return { key: 'ia_pausada', label: 'IA pausada', cls: 'tag--pausada', icon: 'pause' };
    if (c.waitingCustomer) return { key: 'aguardando', label: 'Aguardando cliente', cls: 'tag--wait', icon: 'clock' };
    return { key: 'ia_ativa', label: 'IA respondendo', cls: 'tag--ia', icon: 'sparkle' };
  }

  /* o alerta comunica a CAUSA (badge curta) e o detalhe (texto completo) */
  function alertMeta(c) {
    var k = SO.data.alertKinds[c.alert.kind];
    return {
      label: k ? k.label : 'Precisa de atenção',
      reason: c.alert.reason || (k ? k.reason : '')
    };
  }

  /* a maioria dos alertas pisca; o de SLA usa contador girando no ícone */
  function alertBlinks(c) {
    if (!c.alert.active) return false;
    var k = SO.data.alertKinds[c.alert.kind];
    return !k || k.display !== 'timer';
  }

  function channelOf(c) { return CHANNELS[c.channel] || CHANNELS.webchat; }
  function sentimentOf(c) { return SENTIMENTS[c.sentiment] || SENTIMENTS.stable; }
  function priorityOf(c) { return PRIORITIES[c.priority] || PRIORITIES.normal; }

  function lastMessage(c) {
    return c.messages.length ? c.messages[c.messages.length - 1] : null;
  }

  function isOpen(id) { return S.openIds.indexOf(id) !== -1; }
  function slotOf(id) { return S.openIds.indexOf(id) + 1; }

  var FILTERS = [
    { key: 'todos',      label: 'Todos',      test: function () { return true; } },
    { key: 'ia_ativa',   label: 'IA ativa',   test: function (c) { return c.owner === 'ai' && c.aiState === 'active' && !c.tabulation; } },
    { key: 'ia_pausada', label: 'IA pausada', test: function (c) { return c.owner === 'ai' && c.aiState === 'paused' && !c.tabulation; } },
    { key: 'operador',   label: 'Operador assumiu', test: function (c) { return c.owner === 'operator'; } },
    { key: 'aguardando', label: 'Aguardando cliente', test: function (c) { return c.waitingCustomer; } },
    /* eixo problema */
    { key: 'alertas',    label: 'Com alerta', test: function (c) { return c.alert.active; } },
    /* eixo sentimento do cliente */
    { key: 'insatisfeitos', label: 'Cliente insatisfeito',
      test: function (c) { return c.sentiment === 'negative' || c.sentiment === 'impacted' || c.sentiment === 'critical'; } },
    { key: 'tabulados',  label: 'Em finalização', test: function (c) { return !!c.tabulation; } }
  ];

  function filterByKey(key) {
    for (var i = 0; i < FILTERS.length; i++) if (FILTERS[i].key === key) return FILTERS[i];
    return FILTERS[0];
  }

  function countFilter(key) {
    var f = filterByKey(key);
    return S.conversations.filter(f.test).length;
  }

  function matchesSearch(c, term) {
    if (!term) return true;
    var t = term.trim().toLowerCase();
    if (!t) return true;
    var onlyDigits = SO.util.digits(t);
    if (onlyDigits.length >= 3 &&
        (SO.util.digits(c.phone).indexOf(onlyDigits) !== -1 || c.protocol.indexOf(onlyDigits) !== -1)) {
      return true;
    }
    return c.name.toLowerCase().indexOf(t) !== -1 ||
           c.protocol.toLowerCase().indexOf(t) !== -1 ||
           c.phone.toLowerCase().indexOf(t) !== -1 ||
           c.campaign.toLowerCase().indexOf(t) !== -1;
  }

  /* lista visível, já ordenada: alerta > atividade mais recente */
  function visible() {
    var f = filterByKey(S.filter);
    return S.conversations
      .filter(function (c) { return f.test(c) && matchesSearch(c, S.search); })
      .sort(function (a, b) {
        if (a.alert.active !== b.alert.active) return a.alert.active ? -1 : 1;
        return b.lastActivity - a.lastActivity;
      });
  }

  function metrics() {
    var m = {
      total: S.conversations.length, iaAtiva: 0, iaPausada: 0, operador: 0,
      alertas: 0, insatisfeitos: 0, tabulados: 0
    };
    S.conversations.forEach(function (c) {
      var st = statusOf(c);
      if (st.key === 'ia_ativa' || st.key === 'aguardando') m.iaAtiva++;
      if (c.owner === 'ai' && c.aiState === 'paused' && !c.tabulation) m.iaPausada++;
      if (c.owner === 'operator') m.operador++;
      if (c.alert.active) m.alertas++;
      if (c.sentiment === 'negative' || c.sentiment === 'impacted' || c.sentiment === 'critical') m.insatisfeitos++;
      if (c.tabulation) m.tabulados++;
    });
    return m;
  }

  return {
    byId: byId, statusOf: statusOf, alertMeta: alertMeta, alertBlinks: alertBlinks,
    channelOf: channelOf, sentimentOf: sentimentOf,
    priorityOf: priorityOf, lastMessage: lastMessage, isOpen: isOpen, slotOf: slotOf,
    visible: visible, metrics: metrics, countFilter: countFilter, filters: FILTERS,
    channels: CHANNELS, sentiments: SENTIMENTS, priorities: PRIORITIES
  };
})();
</script>
<script>
/* Base de conhecimento da IA.
   O operador marca a resposta que ele deu; ela vira um par pergunta/resposta que
   a IA passa a usar nos próximos atendimentos (ver simulator.js → fromKnowledge). */
window.SO = window.SO || {};

SO.knowledge = (function () {
  var items = [];

  var TOPICS = ['Pedido e entrega', 'Fatura e pagamento', 'Cancelamento e retenção',
    'Suporte técnico', 'Troca e devolução', 'Planos e contratação', 'Outros'];

  var STOP = ('de da do das dos a o e é em no na nos nas um uma para por com que qual quais ' +
    'meu minha seu sua isso esse essa aqui ali como quando onde ja já não sim vou vc você ' +
    'me te se ao aos das dos pra pro sobre mais menos muito').split(' ');

  function tokens(text) {
    return String(text).toLowerCase()
      .replace(/[^\wáàâãéêíóôõúüç\s]/g, ' ')
      .split(/\s+/)
      .filter(function (w) { return w.length > 3 && STOP.indexOf(w) === -1; });
  }

  function add(entry) {
    var item = {
      id: SO.util.uid('kb'),
      question: entry.question,
      answer: entry.answer,
      topic: entry.topic,
      author: entry.author,
      from: entry.from,           /* nome do cliente que originou */
      at: new Date(),
      used: 0,
      keys: tokens(entry.question)
    };
    items.unshift(item);
    return item;
  }

  /* casa a fala do cliente com o que já foi ensinado (2+ palavras em comum) */
  function match(text) {
    var words = tokens(text);
    if (!words.length) return null;
    var best = null;
    var bestScore = 0;
    items.forEach(function (item) {
      var score = 0;
      item.keys.forEach(function (k) { if (words.indexOf(k) !== -1) score++; });
      if (score > bestScore) { bestScore = score; best = item; }
    });
    return bestScore >= 2 ? best : null;
  }

  function all() { return items; }
  function count() { return items.length; }

  return { add: add, match: match, all: all, count: count, topics: TOPICS };
})();
</script>
<script>
/* Resumo do atendimento.
   Sem IA real: o resumo é derivado das mensagens da sessão, para o operador
   entender um caso em segundos em vez de ler a conversa inteira. */
window.SO = window.SO || {};

SO.summary = (function () {
  var U = SO.util;

  function clip(text, max) {
    var t = String(text).replace(/\s+/g, ' ').trim();
    return t.length > max ? t.slice(0, max - 1).replace(/[\s,;.]+$/, '') + '…' : t;
  }

  function minutesBetween(a, b) {
    return Math.max(1, Math.round((b - a) / 60000));
  }

  /* falas que realmente movem o atendimento (ignora saudação e "ok") */
  function relevant(list, max) {
    var out = [];
    list.forEach(function (m) {
      var t = m.text.replace(/\s+/g, ' ').trim();
      if (t.length < 25) return;
      if (/^(ok|certo|obrigad|perfeito|de nada|olá|oi)\b/i.test(t) && t.length < 60) return;
      out.push(t);
    });
    return out.slice(-max);
  }

  function nextStep(conv) {
    var sel = SO.select;
    if (conv.alert.active) {
      var meta = sel.alertMeta(conv);
      if (conv.alert.kind === 'no_answer') {
        return 'Assumir e responder — a IA não encontrou a resposta. Ao responder, envie a ' +

      }
      if (conv.alert.kind === 'churn') {
        return 'Assumir e tratar a retenção antes de devolver para a IA.';
      }

      return 'Cliente insatisfeito: vale assumir o atendimento antes que a situação escale.';
    }
    if (conv.owner === 'operator') return 'Você está conduzindo — responda ou devolva para a IA.';

    if (conv.waitingCustomer) return 'Aguardando o cliente. Nenhuma ação necessária agora.';
    return 'A IA está conduzindo normalmente. Acompanhar.';
  }

  function build(conv) {
    var sel = SO.select;
    var msgs = conv.messages.filter(function (m) { return m.author !== 'system'; });
    var customer = msgs.filter(function (m) { return m.author === 'customer'; });
    var ai = msgs.filter(function (m) { return m.author === 'ai'; });
    var operator = msgs.filter(function (m) { return m.author === 'operator'; });

    var first = customer.length ? customer[0] : msgs[0];
    var last = msgs.length ? msgs[msgs.length - 1] : null;

    return {
      conv: conv,
      channel: sel.channelOf(conv).label,
      status: sel.statusOf(conv),
      sentiment: sel.sentimentOf(conv),
      alert: conv.alert.active ? sel.alertMeta(conv) : null,
      minutes: minutesBetween(conv.startedAt.getTime(), last ? last.at.getTime() : Date.now()),
      counts: { total: msgs.length, ai: ai.length, customer: customer.length, operator: operator.length },

      aiDid: relevant(ai, 4).map(function (t) { return clip(t, 120); }),
      customerSaid: relevant(customer.slice(1), 3).map(function (t) { return clip(t, 120); }),
      operatorDid: relevant(operator, 2).map(function (t) { return clip(t, 120); }),
      pending: conv.awaitingSince ? U.fmtClock(
        Math.max(0, Math.floor((Date.now() - conv.awaitingSince.getTime()) / 1000))) : null,
      nextStep: nextStep(conv)
    };
  }

  /* versão em texto, para copiar e colar em outro sistema */
  function asText(s) {
    var L = [];
    L.push('RESUMO DO ATENDIMENTO — ' + s.conv.name);
    L.push('Protocolo ' + s.conv.protocol + ' · ' + s.channel + ' · ' + s.conv.campaign);

      s.customerSaid.forEach(function (t) { L.push('- ' + t); });
    }

      L.push('');

      L.push('O QUE O OPERADOR RESPONDEU');
      s.operatorDid.forEach(function (t) { L.push('- ' + t); });

    L.push('PRÓXIMO PASSO SUGERIDO');
    L.push('- ' + s.nextStep);
    return L.join('\n');
  }
